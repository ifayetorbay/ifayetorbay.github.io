  {id:'aktivite', name:'Aktivite', icon:'🎟️', words:['müze','muze','museum','=tur','turu','tour','giriş','konser','kolezyum','vatikan','gezi','rehber','tekne','plaj','şezlong','bilet','sinema','galeri']},

  {id:'alisveris', name:'Alışveriş', icon:'🛍️', words:['hediyelik','hediye','kıyafet','alışveriş','magnet','ayakkabı','çanta','outlet','parfüm']},
  {id:'diger', name:'Diğer', icon:'📦', words:[]}
];
const catById = id => CATS.find(c => c.id === id) || CATS[CATS.length-1];
const tokens = s => (s||'').toLocaleLowerCase('tr').split(/[^a-z0-9çğıöşü]+/).filter(Boolean);
// Kısa kelimeler ve "=" ile başlayanlar tam eşleşir ("=bar" Barcelona'yı yakalamaz); diğerleri ek alabilir (kira → kirası).
const wordHit = (tok, w) => w[0] === '=' ? tok === w.slice(1) : w.length < 3 ? tok === w : tok.startsWith(w);

// Açıklamadan kategori tahmini: her kategori, açıklamadaki kendi kelimeleri kadar puan alır. Kullanıcının daha önce
// düzelttiği kelimeler de puan katar ama daha az; böylece bir kez öğrenilmiş "Sevilla" gibi bir şehir adı
// "ev kirası" gibi açık bir ifadenin önüne geçmez. Eşitlikte listede önce gelen kazanır.
const knownWord = tok => CATS.some(c => c.words.some(w => wordHit(tok, w)));
function guessCat(desc, learned){
  const t = tokens(desc), score = {};
  for (const c of CATS) for (const tok of t) if (c.words.some(w => wordHit(tok, w))) score[c.id] = (score[c.id] || 0) + 1;
  if (learned) for (const tok of t) if (learned[tok]) score[learned[tok]] = (score[learned[tok]] || 0) + 0.6;
  let best = 'diger', bs = 0;
  for (const c of CATS) if ((score[c.id] || 0) > bs){ best = c.id; bs = score[c.id]; }
  return best;
}

// Dönem: seyahat başlangıç tarihinden önceki harcamalar "Seyahat öncesi" (pre), sonrakiler "Seyahatte" (trip).
// Kullanıcı formda değiştirdiyse kayıttaki e.phase geçerlidir.
const tripStartTs = st => st.trip.start ? new Date(st.trip.start + 'T00:00:00').getTime() : null;
function phaseOf(e, st){ if (e.phase) return e.phase; const s = tripStartTs(st); return s && e.at < s ? 'pre' : 'trip'; }

const toCents = e => Math.round((e.cur === 'EUR' ? e.amount : e.amount / e.rate) * 100);

// Tutarı kişilere böler; artan sentler sıradaki kişilere birer birer dağıtılır.
// w: isteğe bağlı pay ağırlıkları ({id: 2} = o kişi iki pay alır, ör. çift); verilmezse herkes eşit.
function splitShares(v, ids, w){
  const wt = id => (w && w[id] > 1 ? w[id] : 1), tot = ids.reduce((s, id) => s + wt(id), 0);
  const out = {}; let used = 0;
  ids.forEach(id => { out[id] = Math.floor(v * wt(id) / tot); used += out[id]; });
  let rest = v - used;
  for (const id of ids){ if (rest <= 0) break; out[id]++; rest--; }
  return out;
}

// Ortak kasa, kasayı tutan kişi üzerinden hesaplanır: kasaya para koymak o kişiye ödeme yapmak,
// kasadan harcamak o kişinin ödemesi demektir. Kasada kalan para da böylece hesaplaşmaya girer.
function compute(st, dayStart){
  const ids = st.people.map(p => p.id);
  const bal = {}, share = {}, paid = {};
  ids.forEach(id => { bal[id] = 0; share[id] = 0; paid[id] = 0; });
  let kasaIn = 0, kasaOut = 0, kasaBack = 0, total = 0, budgetTotal = 0, preTotal = 0, today = 0;
  const cats = {};
  for (const e of st.entries){
    const v = toCents(e);
    if (e.kind === 'expense'){
      const sh = splitShares(v, e.among, e.weights);
      if (e.settleTL){
        // TL olarak sabit harcama: euro bakiyesine girmez (hesaplaşmaya TL olarak eklenir); "cebinden çıkan" ödeyene yazılır.
        for (const id in sh) share[id] += sh[id];
        if (e.paidBy in paid) paid[e.paidBy] += v;
      } else {
        const payer = e.paidBy === 'kasa' ? st.trip.holder : e.paidBy;
        bal[payer] += v;
        if (e.paidBy === 'kasa') kasaOut += v; else paid[payer] += v;
        for (const id in sh){ bal[id] -= sh[id]; share[id] += sh[id]; }
      }
      total += v; cats[e.cat] = (cats[e.cat] || 0) + v;
      // Bütçe yalnızca seyahat sırasındaki harcamaları sayar.
      if (phaseOf(e, st) === 'pre') preTotal += v;
      else { budgetTotal += v; if (dayStart && e.at >= dayStart) today += v; }
    } else if (e.kind === 'kasa'){
      bal[e.from] += v; bal[st.trip.holder] -= v; kasaIn += v; paid[e.from] += v;
    } else if (e.kind === 'kasaout'){
      // Kasada kalan paranın bir kişiye geri verilmesi: kasayı tutan kişi o kişiye ödeme yapar.
      bal[st.trip.holder] += v; bal[e.to] -= v; kasaBack += v; paid[e.to] -= v;
    } else if (e.kind === 'transfer' && !e.total){
      // Toplam hesaplaşma ödemeleri (e.total) euro hesabına değil, doğrudan TL olarak totalNet'e girer.
      bal[e.from] += v; bal[e.to] -= v;
    }
  }
  return {bal, share, paid, kasaIn, kasaOut, kasaBack, kasaLeft: kasaIn - kasaOut - kasaBack, total, budgetTotal, preTotal, today, cats};
}

// Hemen TL ile ödeşilen harcamalarda kişi başı TL paylar (kuruş). Ödeyen kişi kendine borçlu değildir.
function tlSplits(st){
  return st.entries.filter(e => e.kind === 'expense' && e.settleTL).map(e => {
    const sh = splitShares(Math.round(e.amount * 100), e.among, e.weights);
    const rows = e.among.filter(id => id !== e.paidBy).map(id => ({id, amt: sh[id], paid: (e.tlPaid || []).includes(id)}));
    return {e, rows};
  });
}

// En az sayıda transferle hesabı kapatır (en çok borçlu, en çok alacaklıya öder).
// 5 sentin altındaki kalıntılar (kur yuvarlaması) yok sayılır.
// Euro ve TL dışındaki para birimlerinde (dolar, yen…) e.rate "1 € kaç birim"dir; TL'ye, girildiği
// günün TL kuruyla (e.tlRate, 1 € kaç ₺) çevrilir.
const tlKurus = e => Math.round((e.cur === 'TRY' ? e.amount : e.cur === 'EUR' ? e.amount * e.rate : e.amount / e.rate * e.tlRate) * 100);

// Toplam hesaplaşma (TL kuruş): euro hesabı R kuruyla TL'ye çevrilir, TL ile sabit payları eklenir (gross).
// Yapılan ödemeler ayrı tutulur: out = gönderilen, inn = alınan. net = gross + out − inn. Pozitif = alacaklı.
function totalParts(st, R){
  const {bal} = compute(st), gross = {}, out = {}, inn = {};
  for (const id in bal){ gross[id] = Math.round(bal[id] * R); out[id] = 0; inn[id] = 0; }
  const pay = (from, to, k) => { if (from in out && to in inn){ out[from] += k; inn[to] += k; } };
  for (const {e, rows} of tlSplits(st)) for (const r of rows){ gross[r.id] -= r.amt; gross[e.paidBy] += r.amt; if (r.paid) pay(r.id, e.paidBy, r.amt); }
  for (const e of st.entries) if (e.kind === 'transfer' && e.total) pay(e.from, e.to, tlKurus(e));
  const net = {};
  for (const id in gross) net[id] = gross[id] + out[id] - inn[id];
  return {gross, out, inn, net};
}
const totalNet = (st, R) => totalParts(st, R).net;

// Doğrudan hesaplaşma (TL kuruş, euro hesabı R kuruyla): her harcamada pay sahipleri, ödeyen kişiye payı
// kadar borçlanır. İki kişi arasındaki karşılıklı borçlar birbirinden düşülür (mahsup), başka kimseyle karıştırılmaz.
// Böylece her ödeme gerçek harcamalara dayanır: "Uğur'un ödediklerinden payın 100.000, Murat'ınkinden 5.000".
// Ortak kasa, kasayı tutan kişi üzerinden işler; yapılan ödemeler ilgili ikilinin borcunu kapatır.
// Dönen her ödeme: {from, to, amt, items:[{label, k}]} — k > 0 "from, to'ya borçlu", k < 0 ters yön (mahsup edilen).
function pairPlan(st, R, min = 100){
  const ids = st.people.map(p => p.id), D = {}, items = {};
  const add = (from, to, k, label) => {
    if (from === to || !k || !ids.includes(from) || !ids.includes(to)) return;
    const key = from + '>' + to; D[key] = (D[key] || 0) + k;
    const pk = from < to ? from + '|' + to : to + '|' + from, sign = from < to ? 1 : -1;
    const list = items[pk] || (items[pk] = []), it = list.find(x => x.label === label);
    if (it) it.k += sign * k; else list.push({label, k:sign * k});
  };
  for (const {e, rows} of tlSplits(st)) for (const r of rows) if (!r.paid) add(r.id, e.paidBy, r.amt, e.desc);
  for (const e of st.entries){
    if (e.kind === 'expense' && !e.settleTL){
      const payer = e.paidBy === 'kasa' ? st.trip.holder : e.paidBy, sh = splitShares(toCents(e), e.among, e.weights);
      for (const id in sh) add(id, payer, Math.round(sh[id] * R), e.paidBy === 'kasa' ? e.desc + ' (kasadan)' : e.desc);
    } else if (e.kind === 'kasa') add(st.trip.holder, e.from, Math.round(toCents(e) * R), 'Kasaya koyduğu para');
    else if (e.kind === 'kasaout') add(e.to, st.trip.holder, Math.round(toCents(e) * R), 'Kasadan geri aldığı');
    else if (e.kind === 'transfer') add(e.to, e.from, e.total ? tlKurus(e) : Math.round(toCents(e) * R), 'Yapılan ödeme');
  }
  const out = [];
  for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++){
    const a = ids[i], b = ids[j], x = (D[a + '>' + b] || 0) - (D[b + '>' + a] || 0);
    if (Math.abs(x) < min) continue;
    const pk = a < b ? a + '|' + b : b + '|' + a, dir = (x > 0) === (a < b) ? 1 : -1;   // items yönünü ödemeye çevir
    const its = (items[pk] || []).map(it => ({label:it.label, k:it.k * dir})).filter(it => it.k).sort((p, q) => q.k - p.k);
    out.push(x > 0 ? {from:a, to:b, amt:x, items:its} : {from:b, to:a, amt:-x, items:its});
  }
  return out.sort((p, q) => q.amt - p.amt);
}

function settle(bal, min = 5){
  const deb = [], cre = [];
  for (const id in bal){ if (bal[id] < 0) deb.push([id, -bal[id]]); else if (bal[id] > 0) cre.push([id, bal[id]]); }
  deb.sort((a,b) => b[1]-a[1]); cre.sort((a,b) => b[1]-a[1]);
  const out = []; let i = 0, j = 0;
  while (i < deb.length && j < cre.length){
    const amt = Math.min(deb[i][1], cre[j][1]);
    if (amt >= min) out.push({from: deb[i][0], to: cre[j][0], amt});
    deb[i][1] -= amt; cre[j][1] -= amt;
    if (deb[i][1] === 0) i++;
    if (cre[j][1] === 0) j++;
  }
  return out;
}

function calcAmt(s){
  const nums = [], ops = []; let want = true, sign = 1;

    if ('+-*/'.includes(p)){ if (want && p === '-'){ sign = -sign; continue; } if (want) return NaN; ops.push(p); want = true; }
    else { const v = num1(p); if (!isFinite(v)) return NaN; nums.push(sign * v); sign = 1; want = false; }
  }
  if (want || !nums.length) return NaN;
  const vals = [nums[0]], add = [];
  ops.forEach((op, i) => { const v = nums[i + 1], k = vals.length - 1;
    if (op === '*') vals[k] *= v; else if (op === '/') vals[k] = v ? vals[k] / v : NaN; else { add.push(op); vals.push(v); } });
  const r = add.reduce((acc, op, i) => op === '+' ? acc + vals[i + 1] : acc - vals[i + 1], vals[0]);

// Avrupa Merkez Bankası günlük referans kuru (frankfurter), olmazsa open.er-api. Anahtar gerektirmez.
async function fetchRate(manual){
  if (IN_CLAUDE){ if (manual) toast('Bu ortamda canlı kur alınamıyor. Güncel kuru bankandan bakıp Seyahat sekmesinde elle yaz.'); return; }
  if (rateBusy) return; rateBusy = true; render();
  const srcs = [
    ['https://api.frankfurter.dev/v1/latest?from=EUR&to=' + CURS.slice(1).map(c => c[0]).join(','), j => j.rates],
    ['https://open.er-api.com/v6/latest/EUR', j => j.rates],
  ];
  let ok = false;
  for (const [u, pick] of srcs){
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 6000);
      const r = await fetch(u, {signal: ctl.signal}); clearTimeout(t);
      if (!r.ok) continue;
      const rs = pick(await r.json()) || {}, r4 = v => Math.round(v*10000)/10000;
      if (rs.TRY > 0){
        S.trip.rate = r4(rs.TRY); S.trip.rateAt = Date.now(); S.trip.rateSrc = 'live'; ok = true;
        S.trip.rates = Object.assign({}, S.trip.rates, Object.fromEntries(OTHER_CURS.filter(([c]) => rs[c] > 0).map(([c]) => [c, r4(rs[c])])));
        break;
      }
    } catch(_) {}
  }
  rateBusy = false; rateFailed = !ok; render();
  if (manual) toast(ok ? `Kur güncellendi: 1 € = ${nf4.format(S.trip.rate)} ₺` : 'Canlı kur alınamadı. Kuru Seyahat sekmesinden elle girebilirsin.');
}

  return `<span class="dot"></span>elle girildi${S.trip.rateAt ? ' · ' + hhmm(S.trip.rateAt) : ''}${rateFailed ? ' · canlı alınamadı' : ''}`;

// Toplam hesaplaşmanın kuru: ilk "Ödendi" ile sabitlenir, böylece ödemeler farklı günlerde yapılsa da tutarlar kaymaz.
function totalPlan(){
  const lock = S.entries.filter(e => e.kind === 'transfer' && e.total).sort((a,b) => a.at - b.at)[0];
  const R = lock ? lock.rate : S.trip.rate, T = totalParts(S, R), direct = pairPlan(S, R);
  // Daha az ödeme: borçlar birleştirilir (herkesin toplamı aynı). Seyahatin ortak ayarı, varsayılan doğrudan.
  const short = settle(T.net, 100).map(p => ({...p, items:[]})), mode = S.trip.settleMode === 'min' ? 'min' : 'direct';
  const plan = mode === 'min' ? short : direct;
  // Kişinin kalan bakiyesi, ekranda görünen ödemelerin toplamıdır (pozitif = alacaklı).
  const net = {}; S.people.forEach(p => net[p.id] = 0);
  plan.forEach(p => { net[p.from] -= p.amt; net[p.to] += p.amt; });
  return {R, T, net, plan, mode, nDirect:direct.length, nShort:short.length, locked: !!lock};   // 1 TL altı kalıntılar yok sayılır
}
const tlk = k => nf.format(k/100) + ' ₺';
// Kişinin toplam durumu; ödeme yapıldıysa altında "toplam − ödenen = kalan" hesabı.
function meText(T, R, net, head = true){
  // Kalan (b) ödeme listesinden gelir; toplam borç/alacak = kalan + gönderilen − alınan.
  const id = S.me, b = (net || T.net)[id] || 0, out = T.out[id] || 0, inn = T.inn[id] || 0, g = b - out + inn;
  let h = !head ? '' : Math.abs(b) < 100 ? `${nm(id)}, hesabın denk.`
    : `${nm(id)}, toplamda <b class="num">${tlk(Math.abs(b))}</b> ${b > 0 ? 'alacaklısın' : 'göndereceksin'} (${eu(Math.round(Math.abs(b) / R))})`;
  if (!out && !inn) return h;
  const debt = g < 0, ln = (l, v) => `<span>${l}</span><span>${v}</span>`;
  h += `<div class="math num">` + ln(debt ? 'Toplam borcun' : 'Toplam alacağın', tlk(Math.abs(g)))
    + (debt ? (out ? ln('Gönderdiğin', '− ' + tlk(out)) : '') + (inn ? ln('Sana gelen', '+ ' + tlk(inn)) : '')
            : (inn ? ln('Sana gelen', '− ' + tlk(inn)) : '') + (out ? ln('Gönderdiğin', '+ ' + tlk(out)) : ''))
    + `<span class="tot">${Math.abs(b) < 100 ? 'Kalan' : b < 0 ? 'Kalan · göndereceksin' : 'Kalan · alacaksın'}</span><span class="tot">${tlk(Math.abs(b) < 100 ? 0 : Math.abs(b))}</span></div>`;
  return h;
}

// ---- kişi başı bütçe ----
// Bütçe ₺, € ya da $ ile girilebilir (S.trip.planCur); hesap için güncel kurla TL kuruşa çevrilir.
const PLAN_CURS = ['TRY', 'EUR', 'USD'];
const planCurOf = () => S.trip.planCur || 'TRY';
function planKurus(){
  const v = S.trip.plan, c = planCurOf(); if (!(v > 0)) return 0;
  if (c === 'TRY') return Math.round(v * 100);
  const r = perEur(c); return r ? Math.round(v / r * S.trip.rate * 100) : 0;
}
// TL kuruşu istenen para biriminde gösterir (dec 0: kuruşsuz).
function fromTL(k, c, dec){
  const r = perEur(c); if (!r) return nf0.format(Math.round(k / 100)) + ' ₺';
  const a = k / 100 / S.trip.rate * r;
  return dec === 0 ? nf0.format(Math.round(a)) + ' ' + symOf(c) : money(a, c);
}
// Tek bütçe: "bu tatil kişi başı kaça mal olsun" (S.trip.plan, S.trip.planCur). Seyahat öncesi harcananlar düşülür,
// kalan para seyahat günlerine bölünür. Her harcama girildiği günün kuruyla TL'ye çevrilir (tlKurus);
// kişi başı tutar = toplam / kişi sayısı. Günlük sınır gün başında hesaplanır: bugünkü harcama, bugünün sınırını düşürür.
function planState(){
  const n = headcount(), t0 = startOfToday();
  let pre = 0, trip = 0, today = 0;
  for (const e of S.entries) if (e.kind === 'expense'){
    const k = tlKurus(e);
    if (phaseOf(e, S) === 'pre') pre += k; else { trip += k; if (e.at >= t0) today += k; }
  }
  pre /= n; trip /= n; today /= n;
  const day = tripDay(Date.now()), len = S.trip.end && S.trip.start ? tripDay(new Date(S.trip.end + 'T00:00:00').getTime()) : null;
  const started = day !== null ? day >= 1 : trip > 0, ended = !!len && day > len;
  const plan = planKurus(), spent = pre + trip;
  const leftDays = ended ? 0 : started ? (len ? len - day + 1 : 0) : (len || 0);      // bugün dahil
  const dayLimit = plan && leftDays ? Math.max(0, plan - spent + (started ? today : 0)) / leftDays : 0;
  const elapsed = started && day !== null ? (len ? Math.min(day, len) : day) : 0;
  return {n, pre, trip, today, spent, plan, left:plan - spent, day, len, started, ended, leftDays, dayLimit, elapsed};
}
// Uyarı için: bugünkü ve toplam bütçenin ne kadarı kullanıldı (%80'de turuncu, aşınca kırmızı).
function budgetState(){
  const P = planState(), out = [];
  if (P.plan && P.started && !P.ended && P.dayLimit) out.push({key:'daily', pct:P.today / P.dayLimit});
  if (P.plan) out.push({key:'total', pct:P.spent / P.plan});
  out.forEach(b => { b.lvl = b.pct >= 1 ? 'over' : b.pct >= .8 ? 'near' : ''; });
  return out;
}
let editPlan = false, planDraft = null;
function bar(pct, lvl){ return `<div class="prog ${lvl}"><div class="track"><div class="fill" style="width:${Math.min(100, Math.max(0, pct*100)).toFixed(1)}%"></div></div></div>`; }

// Kişi başı bütçe kartı: seyahat öncesinde gidişe kalan gün ve seyahate kalan para, seyahatte bugünkü sınır
// ve kalan bütçe, seyahat bitince kapanış özeti. Bütçe tutarı kartın içinden değiştirilebilir.
function budgetHtml(){
  const P = planState(); if (!S.people.length) return '';
  // Büyük tutarlar bütçenin para biriminde (kuruşsuz), günlük tutarlar euroda (bütçe dolar ise dolarda).
  const c = planCurOf(), pB = k => fromTL(k, c, 0), pD = k => fromTL(k, c === 'TRY' ? 'EUR' : c), pAlt = k => c === 'TRY' ? pD(k) : fromTL(k, 'TRY', 0);
  if (!P.spent && !P.plan && !S.trip.start) return '';
  const lvlOf = pct => pct >= 1 ? 'over' : pct >= .8 ? 'near' : '';
  const d = planDraft || {v:'', cur:c};
  const editor = `<div class="planedit"><input class="inp num" id="planInp" inputmode="decimal" placeholder="ör. ${{TRY:'60.000', EUR:'1.500', USD:'1.600'}[d.cur]}" value="${esc(d.v)}" aria-label="Kişi başı bütçe">
      <div class="seg" role="group" aria-label="Bütçe para birimi">${PLAN_CURS.map(k => `<button type="button" data-plancur="${k}" aria-pressed="${d.cur === k}">${symOf(k)}</button>`).join('')}</div>
      <button class="btn sm pri" data-act="saveplan">Kaydet</button></div><span class="note">Bu tatil kişi başı kaça mal olsun? Uçak, otel ve seyahatteki harcamalar dahil. Sonradan istediğin zaman değiştirebilirsin.</span>`;
  const planAmt = `${nf0.format(S.trip.plan || 0)} ${symOf(c)}`;
  const planLine = P.plan ? `<div class="pline num"><span>Bütçe: kişi başı <b>${planAmt}</b>${c !== 'TRY' ? ` <small>≈ ${fromTL(P.plan, 'TRY', 0)}</small>` : ''}</span><button class="link" data-act="editplan">değiştir</button></div>`
    : S.trip.plan > 0 ? `<div class="pline"><span>Bütçe ${planAmt}: ${symOf(c)} kuru alınamadı</span><button class="link" data-act="editplan">değiştir</button></div>`
    : `<div class="pline"><span>Bütçe belirlenmedi</span><button class="link" data-act="editplan">Bütçe belirle</button></div>`;
  let head, body = '';

  if (P.ended){
    // Kapanış özeti
    const C = compute(S), top = Object.entries(C.cats).sort((a, b) => b[1] - a[1])[0], cat = top && catById(top[0]);
    const open = isFamily() ? 0 : totalPlan().plan.length, diff = P.plan - P.spent;
    head = `<span>Seyahat bitti</span><span class="cd">${tripRange(S.trip)} · ${P.len} gün</span>`;
    body = `<div class="big2 num">${pB(P.spent)}<small>kişi başı toplam</small></div>`
      + (P.plan ? `<p class="tip">${diff >= 0 ? `Bütçenin <b class="pos">${pB(diff)} altında</b> kaldınız.` : `Bütçe <b class="neg">${pB(-diff)} aşıldı</b>.`} (Bütçe ${pB(P.plan)})</p>` : '')
      + `<p class="tip">Seyahatte günde ortalama <b>${pD(P.trip / (P.len || 1))}</b>${cat ? ` · en çok ${cat.icon} ${cat.name} (%${Math.round(top[1] * 100 / C.total)})` : ''}.</p>`
      + (open ? `<button class="btn sm pri" data-tab="settle">${open} ödeme bekliyor · Hesaplaşmaya git</button>` : `<p class="tip pos"><b>Hesaplar kapandı, herkes denk. 🎉</b></p>`)
      + `<button class="link" data-tab="sum">📖 Seyahat hikâyesini gör ›</button>`
      + (S.sample ? '' : `<div class="two"><button class="btn sm" data-act="sameteam">🔁 Aynı ekiple</button><button class="btn sm pri" data-act="newtrip">+ Yeni seyahat</button></div>`)
      + (!isRO() && !open ? `<button class="link" data-tab="trip">🗄️ Hesaplar kapandı; seyahati arşivleyebilirsin ›</button>` : '');
  } else if (!P.started){
    // Seyahat öncesi
    const toGo = P.day !== null ? 1 - P.day : null;
    head = `<span>Kişi başı bütçe${help('plan')}</span>${toGo !== null ? `<span class="cd">${toGo === 0 ? 'Gidiş bugün' : `Gidişe ${toGo} gün`}</span>` : ''}`;
    if (S.trip.start) body += `<div class="when num">📅 ${tripRange(S.trip)}${P.len ? ` · ${P.len} gün` : ''}</div>`;
    body += (editPlan ? editor : planLine)
      + `<div class="ln num"><span>Seyahat öncesi harcanan</span><b>${pB(P.pre)}</b></div>`;
    if (P.plan){
      body += `<div class="ln num"><span>Seyahate kalan</span><b class="${P.left < 0 ? 'neg' : ''}">${P.left < 0 ? '− ' : ''}${pB(Math.abs(P.left))} <small class="hint">≈ ${pAlt(Math.abs(P.left))}</small></b></div>`
        + bar(P.spent / P.plan, lvlOf(P.spent / P.plan))
        + (P.left <= 0 ? `<p class="tip neg"><b>Bütçe seyahatten önce doldu.</b> Bütçeyi gözden geçirin.</p>`
          : P.leftDays ? `<p class="tip">${P.leftDays} günlük seyahatte kişi başı günde yaklaşık <b>${pD(P.dayLimit)}</b> harcayabilirsiniz.</p>`
          : `<p class="tip">Dönüş tarihini girersen günlük harcama sınırını hesaplarım.</p>`);
    }
  } else {
    // Seyahatte
    head = `<span>Kişi başı bütçe${help('plan')}</span>${P.len ? `<span class="cd">${Math.min(P.day, P.len)}. gün / ${P.len}</span>` : ''}`;
    if (P.plan && P.dayLimit){
      const r = P.dayLimit - P.today;
      body += `<div class="ln num" data-hhost><span>Bugün${help('limit')}</span><span>${r >= 0 ? `<b>${pD(r)}</b> kaldı` : `<b class="neg">${pD(-r)}</b> aşıldı`}</span></div>`
        + bar(P.today / P.dayLimit, lvlOf(P.today / P.dayLimit))
        + `<div class="sub num"><span>${pD(P.today)} harcandı</span><span>Bugünkü sınır ${pD(P.dayLimit)}</span></div>`;
    }
    if (P.plan){
      body += `<div class="ln num"><span>Toplam</span><span>${P.left >= 0 ? `<b>${pB(P.left)}</b> kaldı` : `<b class="neg">${pB(-P.left)}</b> aşıldı`}</span></div>`
        + bar(P.spent / P.plan, lvlOf(P.spent / P.plan))
        + `<div class="sub num"><span>${pB(P.spent)} harcandı</span><span>Seyahat öncesi ${pB(P.pre)} dahil</span></div>`;
    } else {
      const avg = P.elapsed ? P.trip / P.elapsed : 0;
      body += `<div class="stats num"><div><small>Bugün</small><b>${pD(P.today)}</b></div><div><small>Günlük ortalama</small><b>${avg ? pD(avg) : '–'}</b></div>`
        + `<div><small>${P.len && avg ? 'Bu hızla toplam' : 'Şu ana kadar'}</small><b>${pB(P.len && avg ? P.pre + avg * P.len : P.spent)}</b></div></div>`;
    }
    body += editPlan ? editor : planLine;
  }
  return `<section class="budget"><div class="bhead" data-hhost>${head}</div>${body}</section>`;
}

function viewList(C){
  let h = `<section class="hero">
    <div><div class="lbl">Toplam harcama</div>
    <div class="big num">${eu(C.total)}</div><div class="eur num">bugünkü kurla ${tl(C.total)}</div>
    ${C.preTotal ? `<div class="eur num">Seyahat öncesi ${eu(C.preTotal)} · Seyahatte ${eu(C.total - C.preTotal)}</div>` : ''}</div>
    <div class="me">${meLine(C)}</div></section>`;
  h += airportHtml() + budgetHtml();
  if (S.trip.kasaOn && !isFamily()){
    const hasKasa = S.entries.some(e => e.kind === 'kasa' || e.kind === 'kasaout' || (e.kind === 'expense' && e.paidBy === 'kasa'));
    const short = C.kasaLeft < 0;
    h += `<section class="kasa ${short ? 'short' : ''}" data-hhost><div><div class="t">${short ? 'Kasa açığı' : 'Ortak kasa'}${help('kasa')}</div>
    <div class="v num">${eu(Math.abs(C.kasaLeft))}</div><div class="h">${short ? 'Kasadan harcanan, konulandan fazla. Kasaya para ekleyin.' : `${nm(S.trip.holder)} tutuyor`}</div></div>
    <div class="kacts"><button class="btn sun" data-act="kasa">Kasaya ekle</button>${hasKasa ? `<button class="btn sm" data-act="kasaempty">Kasayı boşalt</button>` : ''}</div></section>`;
  }
  const es = [...S.entries].sort((a,b) => b.at - a.at);
  if (!es.length) return h + `<div class="card done">Henüz harcama yok. İlk kahveyi kim ısmarlıyor? ☕<br>Sağ alttaki <b>+ Harcama</b> ile başla.</div>`;
  // Önce seyahat günleri (en yeni üstte), en altta "Seyahat öncesi" bölümü.
  const isPre = e => e.kind === 'expense' && phaseOf(e, S) === 'pre';
  let last = null, open = false;
  for (const e of es.filter(e => !isPre(e))){
    const n = tripDay(e.at), dl = n >= 1 ? `${n}. gün · ${dayLabel(e.at)}` : dayLabel(e.at);
    if (dl !== last){ if (open) h += `</div>`; h += `<div class="day">${dl}</div><div class="list">`; open = true; last = dl; }
    h += rowHtml(e);
  }
  if (open) h += `</div>`;
  const pre = es.filter(isPre);
  if (pre.length){
    const tot = pre.reduce((s, e) => s + tlKurus(e), 0);
    h += `<div class="day">Seyahat öncesi · ${tlk(tot)}</div><div class="list">${pre.map(rowHtml).join('')}</div>`;
  }
  return h;
}

// Her satır sağa ya da sola kaydırılınca arkasındaki "Sil" düğmesi görünür.

function rowInner(e){

    <span class="amt num"><b>${money(e.amount, e.cur)}</b>${other}</span></button>`;
  if (e.kind === 'transfer') return `<button class="row trf" data-edit="${e.id}"><span class="ic">🤝</span>
    <span class="mid"><span class="d">${nm(e.from)} → ${nm(e.to)}</span><span class="m">${e.note ? esc(e.note) : 'Hesap kapatma'}${e.cur === 'TRY' ? ` · kur ${nf4.format(e.rate)}` : ''}</span></span>

  const who = isFamily() ? `✍️ ${nmE(by || e.paidBy)} girdi` : (e.paidBy === 'kasa' ? '💰 Kasadan' : `${nmE(e.paidBy)} ödedi`) + (by && by !== e.paidBy ? ` · ✍️ ${nm(by)} girdi` : '');
  const wk = id => e.weights && e.weights[id] > 1 ? ` ×${e.weights[id]}` : '';
  const among = e.among.length === S.people.length && !e.weights ? `${e.among.length} kişi` : e.among.map(id => nm(id) + wk(id)).join(', ');
  return `<button class="row${isBig(e) ? ' big' : ''}" data-edit="${e.id}"><span class="ic" title="${cat.name}">${cat.icon}</span>
    <span class="mid"><span class="d">${esc(e.desc)}</span><span class="m">${phaseOf(e, S) === 'pre' ? new Date(e.at).toLocaleDateString('tr-TR', {day:'numeric', month:'short'}) + ' · ' : ''}${who} · ${among}${e.hasPhoto ? ' · 🧾 fiş' : ''}</span>${e.place ? `<span class="m">📍 ${esc(e.place)}</span>` : ''}</span>

// Hesaplaşma: en üstte tek kutuda toplam hesap; ayrıntılar kapalı bölümlerde.
// Bir ödemenin gerekçesi: kısa özet (ilk iki kalem) ve dokununca açılan kalem kalem döküm.
function whyHtml(p){
  if (!p.items.length) return '';
  const pos = p.items.filter(it => it.k > 0), neg = p.items.filter(it => it.k < 0);
  const short = pos.slice(0, 2).map(it => esc(it.label)).join(', ') + (pos.length > 2 ? ` ve ${pos.length - 2} kalem daha` : '') + (neg.length ? ' · mahsup edildi' : '');
  return `<details class="why"><summary>${short || 'Ayrıntı'}</summary><div class="wl num">`
    + p.items.map(it => `<div><span>${esc(it.label)}</span><span>${it.k > 0 ? '+' : '−'} ${tlk(Math.abs(it.k))}</span></div>`).join('')
    + `<div class="tot"><span>${nm(p.from)} → ${nm(p.to)}</span><span>${tlk(p.amt)}</span></div></div></details>`;
}
function payHtml(p, i, R){
  return `<div class="pay"><div class="l1"><span class="who">${nmE(p.from)}<span class="arrow">→</span>${nmE(p.to)}</span>
      <span class="tl num">${tlk(p.amt)}<small>${eu(Math.round(p.amt / R))}</small></span></div>${whyHtml(p)}
    <div class="acts"><button class="btn sm" data-act="copyamt" data-i="${i}">Tutarı kopyala</button><button class="btn sm pri" data-act="paid" data-i="${i}">Ödendi</button></div></div>`;
}
// Hesaplaşma: en üstte kişinin toplamı, altında kendi ödemeleri (gerekçesiyle); diğerlerininki kapalı bölümde.
function viewSettle(C){
  const {R, T, net, plan, mode, nDirect, nShort, locked} = totalPlan();
  const mine = [], others = [];
  plan.forEach((p, i) => (p.from === S.me || p.to === S.me ? mine : others).push([p, i]));
  // Her sekme aynı yapıda renkli bir özet kartıyla açılır: burada kişinin göndereceği ya da alacağı.
  const b = net[S.me] || 0, z = Math.abs(b) < 100, math = meText(T, R, net, false);
  let h = `<section class="hero"><div><div class="lbl">${emojiOf(S.me)} ${nm(S.me)} · senin durumun</div>
    <div class="big num">${z ? 'Denk ✓' : tlk(Math.abs(b))}</div>
    <div class="eur num">${z ? 'Göndereceğin ya da alacağın bir şey yok' : `${b < 0 ? 'göndereceksin' : 'alacaksın'} · ≈ ${eu(Math.round(Math.abs(b) / R))}`}</div></div>
    ${math ? `<div class="me">${math}</div>` : ''}</section>`;
  h += `<section class="bigcard"><div class="head" data-hhost><h2>Senin ödemelerin${help('settle')}</h2><span class="note num">1 € = ${nf4.format(R)} ₺</span></div>
    <span class="note">${mode === 'min' ? 'Seyahat öncesi + seyahatte, her şey dahil.' : 'Seyahat öncesi + seyahatte, her şey dahil. Her ödeme, kimin harcamasına ortak olduğuna göre.'}${locked ? ' Kur ilk ödemeyle sabitlendi.' : ''}</span>`
    // Daha az ödeme açıkken en üstte uyarı: ödemeler harcamayı yapana değil, birleştirilmiş kişiye gidiyor.
    + (mode === 'min' ? `<div class="callout warn"><b>⚠️ “Daha az ödeme” açık</b><span>Borçlar birleştirildi: bazı ödemeler harcamayı yapan kişiye değil, başka birine gidiyor. Herkesin göndereceği ve alacağı <b>toplam tutar aynı</b>.</span>
        <button class="btn sm" data-act="setmode" data-m="direct">Doğrudan ödemeye dön (${nDirect} ödeme)</button></div>` : '');
  if (!plan.length) h += `<div class="done">Hesaplar tertemiz ✨<br>Kimsenin kimseye borcu yok.</div>`;
  else if (!mine.length) h += `<div class="done">Senin hesabın denk 👌<br>Göndereceğin ya da alacağın bir şey yok.</div>`;
  else h += mine.map(([p, i]) => payHtml(p, i, R)).join('');
  // Doğrudan yöntemdeyken, ödeme sayısı gerçekten azalıyorsa açıklamalı öneri kutusu.
  if (mode !== 'min' && nShort < nDirect) h += `<div class="callout"><b>💡 ${nDirect} yerine ${nShort} ödemeyle de kapanabilir</b>
    <span>Borçlar birleştirilir: daha az havale yapılır, herkesin toplam tutarı aynı kalır; sadece <b>kime</b> gönderileceği değişir. Seçim herkes için geçerlidir.</span>
    <button class="btn sm" data-act="setmode" data-m="min">Daha az ödemeye geç</button></div>`;
  if (!locked) h += `<button class="link" data-act="rate">${rateBusy ? 'Kur güncelleniyor…' : 'Kuru güncelle'}</button>`;
  h += `</section>`;
  if (others.length) h += `<details class="more" id="dOthers" ${openDet.dOthers ? 'open' : ''}><summary>Diğerlerinin ödemeleri (${others.length})</summary><div class="inner"><div class="list">`
    + others.map(([p, i]) => payHtml(p, i, R)).join('') + `</div></div></details>`;

  const payments = S.entries.filter(e => e.kind === 'transfer').sort((a, b) => a.at - b.at);
  if (payments.length) h += `<details class="more" id="dKalem" ${openDet.dKalem ? 'open' : ''}><summary>Yapılan ödemeler (${payments.length})</summary><div class="inner">`
    + `<div class="list">${payments.map(rowHtml).join('')}</div></div></details>`;
  h += `<details class="more" id="dBal" ${openDet.dBal ? 'open' : ''}><summary>Kişi bakiyeleri</summary><div class="inner"><div class="list">`
    + S.people.map(p => {
      const b = net[p.id] || 0, z = Math.abs(b) < 100;
      return `<div class="bal"><span class="av">${initial(p.id)}</span><span class="n">${esc(p.name)}<small>${z ? 'denk' : b > 0 ? 'alacaklı' : 'borçlu'}</small></span>
        <span class="num" style="text-align:right"><b class="${z ? '' : b > 0 ? 'pos' : 'neg'}">${z ? '' : b > 0 ? '+' : '−'}${tlk(Math.abs(b))}</b><br><small class="hint">${eu(Math.round(Math.abs(b) / R))}</small></span></div>`;
    }).join('') + `</div>`
    + (S.trip.kasaOn && C.kasaLeft > 0 ? `<p class="note">Kasada kalan ${eu(C.kasaLeft)} ${nm(S.trip.holder)} kişisinde; hesaba dahil edildi.</p>` : '')
    + `</div></details>`;
  h += `<button class="btn block" data-act="share">WhatsApp için özet</button>`;
  return h;
}

// ---- seyahat hikâyesi ----
// Eğlenceli özet: en çok neye harcandı, en pahalı gün, en çok ödeyen, kahveyi kim ısmarladı, en büyük harcama, en çok
// harcanan yer. Seyahat bitince "Seyahat hikâyesi", sürerken "Şimdiye kadar". Görsel olarak paylaşılabilir.
function storyFacts(){
  const exps = S.entries.filter(e => e.kind === 'expense'); if (exps.length < 3) return null;
  const C = compute(S), P = planState(), facts = [];
  const top = Object.entries(C.cats).sort((a, b) => b[1] - a[1])[0];
  if (top){ const c = catById(top[0]); facts.push([c.icon, 'En çok harcanan', `${c.name} · %${Math.round(top[1] * 100 / (C.total || 1))}`]); }
  const days = {};
  exps.filter(e => phaseOf(e, S) !== 'pre').forEach(e => { const d = new Date(e.at); d.setHours(0,0,0,0); days[d.getTime()] = (days[d.getTime()] || 0) + toCents(e); });
  const bd = Object.entries(days).sort((a, b) => b[1] - a[1])[0];
  if (bd){ const n = tripDay(+bd[0]); facts.push(['📅', 'En pahalı gün', `${n >= 1 ? n + '. gün' : dayLabel(+bd[0])} · ${eu(bd[1])}`]); }
  const payer = S.people.map(p => [p.id, C.paid[p.id] || 0]).sort((a, b) => b[1] - a[1])[0];
  if (payer && payer[1] > 0) facts.push(['🤲', 'En çok ödeyen', `${emojiOf(payer[0])} ${rawName(payer[0])}`]);
  const kahve = {};
  exps.filter(e => e.paidBy !== 'kasa' && tokens(e.desc).some(t => /^(kahve|coffee|cafe|kafe|espresso|latte|cappuccino)/.test(t))).forEach(e => kahve[e.paidBy] = (kahve[e.paidBy] || 0) + 1);
  const kk = Object.entries(kahve).sort((a, b) => b[1] - a[1])[0];
  if (kk) facts.push(['☕', 'Kahveleri ısmarlayan', `${emojiOf(kk[0])} ${rawName(kk[0])} · ${kk[1]} kez`]);
  const big = exps.slice().sort((a, b) => toCents(b) - toCents(a))[0];
  facts.push(['💸', 'En büyük harcama', `${big.desc} · ${money(big.amount, big.cur)}`]);
  const places = {};
  exps.filter(e => e.place).forEach(e => { const city = e.place.split(',').pop().trim(); places[city] = (places[city] || 0) + toCents(e); });
  const pl = Object.entries(places).sort((a, b) => b[1] - a[1])[0];
  if (pl) facts.push(['📍', 'En çok harcanan yer', pl[0]]);
  return {ended:P.ended, perHead:P.spent, count:exps.length, facts};
}

// Hikâyeyi 1080×1350 bir görsele çizer (bayrak renkleriyle) ve paylaşır; paylaşılamazsa görseli açar.
async function shareStory(){
  const st = storyFacts(); if (!st) return;
  const c = themeCountry(), A = c ? c[2] : '#0B6B6B', Q = c ? c[3] : '#F0AE55';
  const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1350; const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 1080, 1350); g.addColorStop(0, A); g.addColorStop(1, '#101418');
  x.fillStyle = g; x.fillRect(0, 0, 1080, 1350);
  x.fillStyle = Q; x.fillRect(0, 0, 1080, 18);
  const F = (w, px) => `${w} ${px}px "Bricolage Grotesque", "Figtree", system-ui, sans-serif`;
  x.fillStyle = '#fff'; x.font = F(800, 64); x.fillText(`${c ? flagOf(c[0]) + ' ' : ''}${S.trip.name}`, 80, 150);
  x.globalAlpha = .8; x.font = F(500, 36); x.fillText(`${tripRange(S.trip) || ''}  ·  ${S.people.map(p => emojiOf(p.id)).join(' ')}`, 80, 210); x.globalAlpha = 1;
  x.font = F(800, 120); x.fillText(fromTL(st.perHead, planCurOf(), 0), 80, 390);
  x.globalAlpha = .8; x.font = F(500, 38); x.fillText(`kişi başı · ${st.count} harcama`, 80, 450); x.globalAlpha = 1;
  let y = 560;
  for (const [i, l, v] of st.facts){
    x.font = F(500, 60); x.fillText(i, 80, y + 20);
    x.globalAlpha = .75; x.font = F(500, 32); x.fillText(l, 180, y - 12); x.globalAlpha = 1;
    x.font = F(700, 44); x.fillText(v.length > 34 ? v.slice(0, 33) + '…' : v, 180, y + 38); y += 120;
  }
  x.globalAlpha = .7; x.font = F(700, 32); x.fillText('Heybe', 80, 1290); x.globalAlpha = 1;
  const url = cv.toDataURL('image/png');
  try {
    const file = new File([dataUrlToBlob(url)], 'seyahat-hikayesi.png', {type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:S.trip.name}); return; }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  showPhoto(url); toast('Görsele basılı tutup kaydedebilir ya da paylaşabilirsin.');
}

// Bu telefonda bu seyahat için kişi seçilmemişse bir kez sorar.
// ---- kimlik ----
// Claude hesabı varsa her hesap seyahatte tek bir kişiye bağlanır (people[].uid): bir kez seçilir, sonra hep o
// kişi olarak açılır; başka bir hesabın seçtiği kişi seçilemez. Bağı sadece seyahati kuran kaldırabilir.
// Not: kayıtlar zaten herkese açık ortak veridir; bu bağ, başkasının "ben Uğur'um" diyerek onun yerine
// işlem yapmasını engeller. Kişisel Alışveriş verisi zaten hesaba özeldir.
let myUid = null, iAmOwner = false;
const myPerson = () => myUid ? S.people.find(p => p.uid === myUid) : null;
// Seyahati kuran: seyahatte kayıtlı kurucu hesap, yoksa yapıtın sahibi. Claude yoksa (bu cihazda) herkes.
const isTripAdmin = () => !myUid ? true : S.trip.ownerUid ? S.trip.ownerUid === myUid : iAmOwner;
function claimPerson(id){
  S.people.forEach(p => { if (p.uid === myUid) delete p.uid; });
  const p = S.people.find(q => q.id === id); if (p){ p.uid = myUid; p.boundAt = Date.now(); delete p.freed; }
  S.me = id; try { localStorage.setItem(meKey(S.tid), id); } catch(_) {}
}
// Bu hesaba bağlı kişi varsa o seçilir; yoksa bu telefonda önceden seçilmiş ve kimseye bağlı olmayan kişi sessizce bağlanır.
// Yanlış seçim: kişi seçtikten sonraki 10 dakika içinde kurucuya gerek kalmadan kendisi düzeltebilir.
const FIX_MS = 10 * 60e3;
// Bir seyahatte bir kez kullanılır; böylece 10 dakikada bir kişiden kişiye geçilemez.
const FIX_KEY = tid => 'yol-hesabi-duzeltti-' + tid;
const fixUsed = () => { try { return !!localStorage.getItem(FIX_KEY(S.tid)); } catch(_) { return true; } };
const selfFixLeft = () => { const p = myPerson(); return p && p.boundAt && !fixUsed() ? Math.max(0, p.boundAt + FIX_MS - Date.now()) : 0; };
function bindMe(){
  if (!myUid || S.sample || !S.people.length) return;
  const mine = myPerson();
  if (mine){ if (S.me !== mine.id){ S.me = mine.id; try { localStorage.setItem(meKey(S.tid), S.me); } catch(_) {} } return; }
  let local = null; try { local = localStorage.getItem(meKey(S.tid)); } catch(_) {}
  const p = local && S.people.find(q => q.id === local);
  if (p && !p.uid && p.freed !== myUid){ claimPerson(p.id); save(); render(); }
}
const IOS_SAFARI = /iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone;
let iosGo = false;

  if (S.sample || !S.people.length || form) return;
  if (IN_WEB && IOS_SAFARI && !iosGo && myUid && !myPerson()){ openSheet({mode:'ios'}); return; }
  if (myUid){ bindMe(); if (!myPerson()) openSheet({mode:'who'}); return; }
  try { if (localStorage.getItem(meKey(S.tid))) return; } catch(_) { return; }
  openSheet({mode:'who'});
}

// Yarım kalan kayıt: sayfa yenilense ya da telefon uygulamayı kapatsa bile formdaki bilgiler kaybolmaz.

const DRAFT = 'yol-hesabi-taslak';
function saveDraft(){
  if (!form || !['expense','kasa','transfer'].includes(form.mode)) return;
  try { const {photo, ...rest} = form; localStorage.setItem(DRAFT, JSON.stringify({...rest, photoChanged:false, savedAt:Date.now()})); } catch(_) {}
}
function clearDraft(){ try { localStorage.removeItem(DRAFT); } catch(_) {} }
function restoreDraft(){
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT) || 'null');
    if (!d || Date.now() - d.savedAt > 864e5 || !S.people.length || isRO()) return clearDraft();
    if (d.placeState === 'loading') d.placeState = d.place ? 'ok' : 'off';
    if (d.id){ const e = S.entries.find(x => x.id === d.id); if (!e) return clearDraft(); d.photo = photoSrc(e); }
    openSheet(d); toast('Yarım kalan kayıt geri getirildi');
  } catch(_) { clearDraft(); }
}

// Euro dışı para biriminde kur satırı; kur bilinmiyorsa doğrudan giriş kutusu açılır.
// Ödemede isteğe bağlı not ("ne için gönderdi"); öneri olarak borç kalemleriyle dolu gelir.
function noteBlock(){
  return `<div class="f"><label for="fNote">Not <span class="auto">isteğe bağlı</span></label><input class="inp" id="fNote" maxlength="80" placeholder="ör. otel payım" value="${esc(form.note || '')}" autocomplete="off"></div>`;
}
function rateBlock(){
  const f = form; if (f.cur === 'EUR') return '';
  const r = f.rate || curRate(f.cur), sym = symOf(f.cur);
  return `<div class="f">${f.showRate || !r ? `<label for="fRate">Kur (1 € kaç ${sym})</label><input class="inp num" id="fRate" inputmode="decimal" placeholder="ör. 1,08" value="${r ? nf4.format(r) : ''}">`
    : `<button type="button" class="link" data-act="editrate">Kur: 1 € = ${nf4.format(r)} ${sym} · değiştir</button>`}</div>`;
}
// Para birimi değişince kur, o birimin güncel kuruna döner (düzenlenen kayıt aynı birimdeyse onun kuru kalır).
function setCur(c){
  const old = form.id ? S.entries.find(x => x.id === form.id) : null;
  form.cur = c; form.showRate = false;
  if (form.mode !== 'transfer') form.rate = old && old.cur === c ? old.rate : null;   // ödemede hesaplaşma kuru kalır
  if (form.mode === 'expense') form.settleTL = c === 'TRY' && form.phase === 'pre';
}
function convNote(){
  const a = parseAmt(form.amount), c = form.cur, r = form.rate || curRate(c);
  if (!(a > 0)) return ' ';
  if (isExpr(form.amount)) return `= ${money(a, c)} · ` + convNote2(a, c, r);
  return convNote2(a, c, r);
}
function convNote2(a, c, r){
  if (c === 'EUR') return `Bugünkü kurla ≈ ${nf.format(a*S.trip.rate)} ₺`;
  if (!r) return 'Bu para birimi için kur yok; kuru yaz.';
  return c === 'TRY' ? `≈ ${nf.format(a/r)} €` : `≈ ${nf.format(a/r)} € · ≈ ${nf.format(a/r*S.trip.rate)} ₺`;
}
function eachNote(){
  const a = parseAmt(form.amount), n = form.among.length;
  if (!n) return 'En az bir kişi seç.';
  const w = id => (form.weights && form.weights[id] > 1 ? form.weights[id] : 1), tot = form.among.reduce((s, id) => s + w(id), 0);
  if (tot === n) return a > 0 ? `Kişi başı ${money(a/n, form.cur)}` : `${n} kişi arasında eşit bölünecek.`;
  if (!(a > 0)) return `${tot} paya bölünecek.`;
  return `Pay başı ${money(a/tot, form.cur)} · ` + form.among.filter(id => w(id) > 1).map(id => `${rawName(id)} ×${w(id)}: ${money(a*w(id)/tot, form.cur)}`).join(' · ');
}
// "Paylar eşit değil mi?": kişi başına ×1…×9 pay (ör. çift ya da aile ×2).

// Serbest ödeme: kimden/kime seçilir; tutar, bu ikili için hesaplaşmadaki kalan borçla dolu gelir (değiştirilebilir).
function payDefault(from, to){ const p = totalPlan().plan.find(q => q.from === from && q.to === to); return p ? nf.format(p.amt / 100) : ''; }
// Not önerisi: bu ikilinin borcunu oluşturan kalemler ("Otel, Müze bileti"). Sadece not; hesabı değiştirmez.
function payNote(from, to){
  const p = totalPlan().plan.find(q => q.from === from && q.to === to);
  const its = p ? p.items.filter(it => it.k > 0 && it.label !== 'Yapılan ödeme').map(it => it.label) : [];
  return its.slice(0, 3).join(', ') + (its.length > 3 ? ' …' : '');
}
function startPay(from, to){

  openSheet({mode:'transfer', pick:true, total:true, cur:'TRY', rate:R, from, to, amount:payDefault(from, to), autoAmt:true, note:payNote(from, to)});
}

// ---- konum ----
// Telefonun konumu alınır, OpenStreetMap ile sokak ve şehir adına çevrilir.
// Sonuç form kapandıktan sonra gelirse, kaydedilmiş harcamaya eklenir.
function locate(f){
  const done = st => { f.placeState = st; if (form === f){ const el = document.getElementById('fPlace'); if (el) el.innerHTML = placeHtml(); } };
  if (!navigator.geolocation) return done('fail');
  f.placeState = 'loading';
  try {
    navigator.geolocation.getCurrentPosition(async pos => {
      const lat = +pos.coords.latitude.toFixed(5), lon = +pos.coords.longitude.toFixed(5);
      let place = `${nf4.format(lat)}, ${nf4.format(lon)}`;
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=tr&lat=${lat}&lon=${lon}`);
        const a = (await r.json()).address || {};
        const street = a.road || a.pedestrian || a.square || a.neighbourhood || a.suburb;
        const city = a.city || a.town || a.village || a.municipality || a.county;
        if (street || city) place = [street, city].filter(Boolean).join(', ');
      } catch(_) {}
      if (f.placeState !== 'loading') return;   // kullanıcı bu arada kaldırdıysa ekleme
      Object.assign(f, {place, lat, lon});
      if (form !== f){ const e = S.entries.find(x => x.id === f.newId); if (e && !e.place){ Object.assign(e, {place, lat, lon}); render(); } }
      done('ok');
    }, err => done(err && err.code === 1 ? 'denied' : 'fail'), {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
  } catch(_) { done('fail'); }
}
function placeHtml(){
  const f = form;
  if (f.placeState === 'loading') return `<span class="note">📍 Konum alınıyor…</span> <button type="button" class="btn sm" data-act="rmplace">Ekleme</button>`;
  if (f.place) return `<span>📍 ${esc(f.place)}</span>${f.lat ? ` <a class="note" href="https://www.openstreetmap.org/?mlat=${f.lat}&mlon=${f.lon}#map=18/${f.lat}/${f.lon}" target="_blank" rel="noopener">Haritada aç</a>` : ''} <button type="button" class="btn sm" data-act="rmplace">Kaldır</button>`;
  const msg = {denied:'Konum izni verilmedi.', fail:'Konum alınamadı.', off:'Konum eklenmedi.'}[f.placeState] || 'Konum eklenmedi.';
  return `<span class="note">📍 ${msg}</span> <button type="button" class="btn sm" data-act="locate">Konumu ekle</button>`;
}

function upsert(e){ const i = S.entries.findIndex(x => x.id === e.id); if (i >= 0) S.entries[i] = e; else S.entries.push(e); }

// Kasa kuralı: kasada olmayan para harcanamaz, kasa hiçbir zaman eksiye düşmez.
// e: değiştirilecek/eklenecek kayıt; remove: true ise kayıt silinecek demektir.
function kasaWouldGoNegative(e, remove){
  const entries = S.entries.filter(x => x.id !== e.id);
  if (!remove) entries.push(e);
  const now = compute(S).kasaLeft, after = compute({...S, entries}).kasaLeft;
  return after < 0 && after < now;
}

// Kasada kalan parayı, herkese kasaya koyduğu oranda geri dağıtır (sent artığı en çok koyana).
function kasaBackPlan(){
  const left = compute(S).kasaLeft; if (left <= 0) return [];
  const net = {}; S.people.forEach(p => net[p.id] = 0);
  S.entries.forEach(e => { if (e.kind === 'kasa') net[e.from] += toCents(e); if (e.kind === 'kasaout') net[e.to] -= toCents(e); });
  const ids = S.people.map(p => p.id).filter(id => net[id] > 0), tot = ids.reduce((s, id) => s + net[id], 0);
  if (!tot) return [];
  let rest = left;
  const out = ids.map(id => { const c = Math.floor(left * net[id] / tot); rest -= c; return [id, c]; });
  out.sort((a, b) => net[b[0]] - net[a[0]]); out[0][1] += rest;
  return out.filter(x => x[1] > 0);
}

function shareText(){
  // Önce toplam hesaplaşma (asıl önemli olan), sonra kalem kalem liste.
  const C = compute(S), {R, plan, locked} = totalPlan(), n = S.people.length;
  let t = `${S.trip.name} – hesap özeti${S.trip.start ? ` (${tripRange(S.trip)})` : ''}\nToplam harcama: ${eu(C.total)} · kişi başı ${eu(Math.round(C.total / n))}\n`;
  if (!isFamily()) t += `\nTOPLAM HESAPLAŞMA (1 € = ${nf4.format(R)} ₺${locked ? ', sabitlendi' : ''})\n`;
  if (!isFamily()) t += plan.length ? plan.map(p => `• ${rawName(p.from)} → ${rawName(p.to)}: ${tlk(p.amt)} (${eu(Math.round(p.amt / R))})`
    + (p.items.length ? `\n  ${p.items.map(it => `${it.label} ${it.k > 0 ? '+' : '−'}${tlk(Math.abs(it.k))}`).join(', ')}` : '')).join('\n') : 'Herkes denk, ödenecek bir şey yok.';
  const line = e => {
    const k = e.among.length, who = e.paidBy === 'kasa' ? 'kasadan' : `${rawName(e.paidBy)} ödedi`;
    return `• ${e.desc}: ${money(e.amount, e.cur)}, ${who}, kişi başı ${money(e.amount / k, e.cur)}`
      + (k === n ? '' : ` (${e.among.map(rawName).join(', ')})`) + (e.settleTL ? ' – TL olarak sabit' : '');
  };
  const exps = S.entries.filter(e => e.kind === 'expense').sort((a, b) => a.at - b.at);
  const pre = exps.filter(e => phaseOf(e, S) === 'pre'), trip = exps.filter(e => phaseOf(e, S) !== 'pre');
  if (pre.length) t += '\n\nKalem kalem – seyahat öncesi:\n' + pre.map(line).join('\n');
  if (trip.length) t += '\n\nKalem kalem – seyahatte:\n' + trip.map(line).join('\n');
  return t + '\n\nHeybe ile hesaplandı.';
}

// Alan sırasından bağımsız karşılaştırma metni (sunucu alanları farklı sırayla döndürebilir).
const canon = v => Array.isArray(v) ? '[' + v.map(canon).join(',') + ']'
  : (v && typeof v === 'object') ? '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}'
  : JSON.stringify(v === undefined ? null : v);
const metaOf = st => ({trip:st.trip, people:st.people, learned:st.learned || {}, lastCur:st.lastCur || 'EUR'});
const metaPath = tid => tid === 'main' ? 'trip/meta' : 'trips/' + tid;
const tidOf = e => e.tripId || 'main';
function resetSync(){ lastMeta = null; seenTid = null; lastEnt.clear(); }

function renderCloud(){
  const el = document.getElementById('cloud'); if (!el) return;
  el.className = 'cloud ' + cloud;
  el.textContent = {on:'· bulutta', connecting:'· eşitleniyor…', error:'· eşitlenemedi', off:'· sadece bu cihazda'}[cloud];
}
function syncSoon(){
  if (!db || !merged || S.sample || !S.people.length) return;     // örnek veri ve boş seyahat buluta yazılmaz
  clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 700);
}
// Yazmalar sırayla yapılır; seyahat değiştirmeden önce bekleyen yazma bitirilir.
function pushNow(){ clearTimeout(pushTimer); pushTimer = null; pushP = pushP.then(pushDiff, pushDiff); return pushP; }
// Sadece değişen belgeleri yazar; her belgeye aynı anda tek yazma.
async function pushDiff(){
  if (!db || !merged || S.sample || !S.people.length) return;
  try {
    const tid = S.tid;
    if (tid !== 'main') S.entries.forEach(e => { e.tripId = tid; });
    const meta = metaOf(S), m = canon(meta);
    if (m !== lastMeta){ await db.doc(metaPath(tid)).set(clone(meta)); lastMeta = m; }
    const ids = new Set();
    for (const e of S.entries){
      ids.add(e.id); const j = canon(e);
      if (lastEnt.get(e.id) !== j){ await db.doc('entries/' + e.id).set(clone(e)); lastEnt.set(e.id, j); }
    }
    for (const id of [...lastEnt.keys()]) if (!ids.has(id)){ await db.doc('entries/' + id).delete(); lastEnt.delete(id); }
    cloud = 'on';
  } catch(err) {
    cloud = 'error';
    if (err && err.code === 'quota_exceeded') toast('Bulut deposu doldu; son kayıtlar sadece bu cihazda.');
  }
  renderCloud();
}

// Seyahat listesi: bulut bağlıysa buluttakiler, değilse bu cihazdakiler; açık seyahat her zaman dahil.
function tripList(){
  const m = new Map();
  if (merged) cloudMetas.forEach((meta, tid) => m.set(tid, {tid, trip:meta.trip, people:meta.people || []}));
  else localTrips().forEach(t => m.set(t.tid || 'main', {tid:t.tid || 'main', trip:t.trip, people:t.people || []}));
  if (!S.sample && S.people.length) m.set(S.tid, {tid:S.tid, trip:S.trip, people:S.people});
  return [...m.values()].filter(t => t.trip && t.people.length)
    .sort((a, b) => (b.trip.start || '').localeCompare(a.trip.start || '') || (a.trip.name || '').localeCompare(b.trip.name || '', 'tr'));
}
// Buluttaki bir seyahati açar (S'yi ve eşitleme izlerini kurar).
function openCloudTrip(tid){
  const rm = clone(cloudMetas.get(tid));
  const entries = [...cloudEnts.values()].filter(e => tidOf(e) === tid).map(clone);
  S = {sample:false, tid, trip:rm.trip, people:noIban(rm.people || []), learned:rm.learned || {}, lastCur:rm.lastCur || 'EUR', me:null, entries};
  S.trip = Object.assign({rateAt:0, rateSrc:'manual', plan:0}, S.trip);
  resetSync(); lastMeta = canon(cloudMetas.get(tid)); seenTid = tid;
  entries.forEach(e => lastEnt.set(e.id, canon(e)));
}
function emptyState(){
  return {sample:false, tid:uid(), trip:{name:'', rate:S.trip.rate, rateAt:S.trip.rateAt, rateSrc:S.trip.rateSrc, kasaOn:false, holder:null, plan:0}, people:[], me:null, learned:S.learned || {}, lastCur:'EUR', entries:[]};
}
// Açık seyahatten çıkmadan önce bekleyen yazmayı bitirir, sonra build() ile yeni seyahati kurar.
async function enterTrip(build, toTab){
  finishUndo(); await pushNow(); stashTrip();
  build(); loadMe(); loadLogs(); loadShop();
  tab = toTab || 'list'; themeNow = null; render(); window.scrollTo(0,0); maybeAskWho();
}
function switchTrip(tid){
  if (tid === S.tid && !S.sample) return;
  return enterTrip(() => {
    if (merged && cloudMetas.has(tid)) openCloudTrip(tid);
    else { const t = localTrip(tid); if (!t) return; S = t; S.tid = S.tid || tid; resetSync(); }
  }).then(() => toast(`${S.trip.name} açıldı`));
}
// Açık seyahati her yerden siler (bulut, bu cihaz, fiş fotoğrafları) ve varsa başka bir seyahate geçer.
async function deleteTrip(){
  await pushNow();
  const tid = S.tid, sample = S.sample;
  S.entries.forEach(e => setPhoto(e.id, null));
  try { localStorage.removeItem(TRIP_KEY(tid)); } catch(_) {}
  if (db && merged && !sample){
    try {
      for (const id of [...lastEnt.keys()]) await db.doc('entries/' + id).delete();
      await db.doc(metaPath(tid)).delete();
      cloudMetas.delete(tid);
    } catch(_) { toast('Seyahat buluttan silinemedi; tekrar dene.'); return; }
  }
  resetSync();
  const next = tripList().find(t => t.tid !== tid);
  if (next){
    if (merged && cloudMetas.has(next.tid)) openCloudTrip(next.tid);
    else { S = localTrip(next.tid) || emptyState(); }
  } else S = emptyState();
  loadMe(); loadLogs(); loadShop(); tab = 'list'; themeNow = null; render(); window.scrollTo(0,0); maybeAskWho();
  toast(next ? `Seyahat silindi. ${S.trip.name} açıldı.` : 'Seyahat silindi');
}

// İlk bağlantı: bulutta açık seyahat varsa o esas alınır. Bu cihazda aynı seyahatin buluta gitmemiş kayıtları
// varsa eklenir; başka bir seyahat varsa kaybolmasın diye yedeklenir. Bu cihazda gerçek seyahat yoksa
// buluttaki ilk seyahat açılır. Bu cihazdaki seyahat bulutta yoksa buluta yüklenir.
function firstMerge(){
  const rm0 = cloudMetas.get(S.tid);
  if (rm0){
    const local = S, rm = clone(rm0);
    const rEntries = [...cloudEnts.values()].filter(e => tidOf(e) === local.tid).map(clone);
    rEntries.forEach(e => lastEnt.set(e.id, canon(e)));
    const sameTrip = !local.sample && local.people.length > 0 && local.people.every(p => (rm.people || []).some(q => q.id === p.id));
    if (!local.sample && !sameTrip && local.entries.length){ try { localStorage.setItem('yol-hesabi-yedek', JSON.stringify(local)); } catch(_) {} }
    const extra = sameTrip ? local.entries.filter(e => !rEntries.some(r => r.id === e.id)) : [];
    S = {sample:false, tid:local.tid, trip:rm.trip, people:noIban(rm.people || []), learned:rm.learned || {}, lastCur:rm.lastCur || 'EUR', me:local.me, entries:rEntries.concat(extra)};
    lastMeta = canon(rm0); seenTid = S.tid;
    fixMe();
  } else if (S.sample || !S.people.length){
    const ids = [...cloudMetas.keys()];
    const first = ids.includes('main') ? 'main' : ids[0];
    if (first){ openCloudTrip(first); loadMe(); themeNow = null; }
  }
  merged = true; cloud = 'on';
  syncSoon();
}
function onRemote(kind){
  if (!gotMeta || !gotTrips || !gotEnt) return;
  if (!merged){
    firstMerge();
    // Davet bağlantısıyla gelindiyse o seyahat açılır.
    const j = IN_WEB ? window.claude.takeJoined() : null;
    if (j && cloudMetas.has(j)){ if (j !== S.tid){ stashTrip(); openCloudTrip(j); loadMe(); themeNow = null; } setTimeout(() => toast(`${S.trip.name} seyahatine katıldın 🎉`), 400); }
    else if (IN_WEB && window.claude.joinFailed()) setTimeout(() => toast('Davet bağlantısı geçersiz; bağlantıyı gönderen kişiden yenisini iste.'), 400);
    else if (IN_WEB && !cloudMetas.size && (navigator.standalone || matchMedia('(display-mode: standalone)').matches)) setTimeout(() => { if (!form) openSheet({mode:'trips'}); }, 600);
    loadLogs(); loadShop(); render(); renderCloud(); maybeAskWho(); return;
  }
  if (kind === 'meta'){
    const rm0 = cloudMetas.get(S.tid);
    if (!rm0){
      // Açık seyahat başka bir cihazda silindi: varsa başka bir seyahate geç.
      if (seenTid === S.tid){
        resetSync();
        const next = tripList().find(t => t.tid !== S.tid && cloudMetas.has(t.tid));
        if (next) openCloudTrip(next.tid); else S = emptyState();
        loadMe(); loadLogs(); loadShop(); themeNow = null; render(); toast('Açık seyahat başka bir cihazda silindi.');
      } else if (form && form.mode === 'trips') drawSheetKeep();
      return;
    }
    seenTid = S.tid;
    const j = canon(rm0);
    if (j !== lastMeta){
      lastMeta = j; const rm = clone(rm0);
      Object.assign(S, {sample:false, trip:rm.trip, people:noIban(rm.people || []), learned:rm.learned || {}, lastCur:rm.lastCur || 'EUR'});
      fixMe(); bindMe(); render(); maybeAskWho();
    }
    if (form && form.mode === 'trips') drawSheetKeep();
  } else {
    let changed = false;
    for (const ch of entSnap.docChanges()){
      const id = ch.doc.id;
      if (ch.type === 'removed'){
        if (lastEnt.has(id)){ lastEnt.delete(id); S.entries = S.entries.filter(e => e.id !== id); changed = true; }
      } else {
        const d = clone(ch.doc.data());
        if (tidOf(d) !== S.tid) continue;
        const j = canon(d);
        if (lastEnt.get(id) !== j){
          lastEnt.set(id, j);
          const i = S.entries.findIndex(e => e.id === id);
          if (i >= 0) S.entries[i] = d; else S.entries.push(d);
          changed = true;
        }
      }
    }
    if (changed) render();
  }
}
async function startCloud(){
  if (!window.claude || !window.claude.use){ renderCloud(); return; }
  try { db = await window.claude.use('db'); } catch(_) { db = null; }
  if (!db){ cloud = 'off'; renderCloud(); return; }
  try { assets = await window.claude.use('assets'); } catch(_) { assets = null; }
  try { userCap = await window.claude.use('user'); } catch(_) { userCap = null; }
  try { if (userCap){ myUid = await userCap.id(); iAmOwner = await userCap.isOwner(); } } catch(_) { myUid = null; }
  cloud = 'connecting'; renderCloud();
  const fail = () => { cloud = 'error'; renderCloud(); };
  db.doc('trip/meta').onSnapshot(snap => {
    if (snap.exists) cloudMetas.set('main', snap.data()); else cloudMetas.delete('main');
    gotMeta = true; onRemote('meta');
  }, fail);
  db.collection('trips').onSnapshot(snap => {
    const ids = new Set(snap.docs.map(d => d.id));
    for (const tid of [...cloudMetas.keys()]) if (tid !== 'main' && !ids.has(tid)) cloudMetas.delete(tid);
    snap.docs.forEach(d => cloudMetas.set(d.id, d.data()));
    gotTrips = true; onRemote('meta');
  }, fail);
  db.collection('log').onSnapshot(snap => {
    cloudLogs = snap.docs.map(d => d.data()); if (tab === 'sum') render();
  }, () => {});
  db.collection('entries').onSnapshot(snap => {
    entSnap = snap; cloudEnts.clear(); snap.docs.forEach(d => cloudEnts.set(d.id, d.data()));
    gotEnt = true; onRemote('ent');
  }, fail);
}

// Web: yapıştırılan davet ya da kurucu bağlantısıyla seyahate katılır ve onu açar.
async function joinFromLink(){
  const el = document.getElementById('joinUrl'), v = el ? el.value.trim() : '';
  if (!v) return toast('Önce davet bağlantısını yapıştır.');
  const r = await window.claude.joinWith(v);
  if (!r.ok) return toast(r.tid ? 'Bağlantı geçersiz ya da kullanılmış; gönderen kişiden yenisini iste.' : 'Bu bir Heybe davet bağlantısı değil.');
  for (let i = 0; i < 30 && !cloudMetas.has(r.tid); i++) await new Promise(ok => setTimeout(ok, 200));
  if (!cloudMetas.has(r.tid)) return toast('Katıldın; seyahat birazdan listede görünecek.');
  closeSheet(); await switchTrip(r.tid); maybeAskWho();
}
// Web: seyahatin davet bağlantısını WhatsApp'ta (ya da telefonun paylaş menüsünde) paylaşır.
async function inviteFriends(){
  if (!IN_WEB || S.sample) return;
  try {
    await pushNow();
    const link = await window.claude.inviteLink(S.tid);
    const text = inviteText(link);
    if (navigator.share){ try { await navigator.share({title:'Heybe', text}); return; } catch(e){ if (e && e.name === 'AbortError') return; } }
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  } catch(_) { toast('Davet bağlantısı oluşturulamadı; internet bağlantını kontrol et.'); }
}

// ---- fişten doldur ----
// Fiş fotoğrafından tutar, para birimi ve açıklama okunur. Claude varsa (görüntüleyenin kendi hesabı, ilk kullanımda
// izin sorulur) onunla; yoksa — Claude hesabı olmayanlar, ileride uygulama mağazası sürümü — telefonun kendisinde
// Tesseract ile okunur: ilk kullanımda birkaç MB indirilir, fotoğraf hiçbir sunucuya gönderilmez.
let sampleFn = null, sampleImg = false;
async function startSample(){
  if (!window.claude || !window.claude.use) return;
  try { sampleFn = await window.claude.use('sample'); } catch(_) { sampleFn = null; }
  if (!sampleFn) return;
  const l = await sampleFn.limits().catch(() => null);
  sampleImg = !!(l && l.images);
  if (sampleImg && form && form.mode === 'expense') drawSheetKeep();
}
let tessP = null;
function loadTess(){
  return tessP || (tessP = new Promise((ok, no) => {
    const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    sc.onload = () => window.Tesseract ? ok(window.Tesseract) : no(new Error('yok'));
    sc.onerror = () => { tessP = null; no(new Error('indirilemedi')); };
    document.head.appendChild(sc);
  }));
}
// Fiş metninden toplam: önce "TOPLAM/TOTAL/…" satırındaki tutar (ara toplam ve vergi satırları hariç), yoksa en büyük tutar.
function parseReceipt(text){
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const amtRe = /\d{1,3}(?:[.,\s]\d{3})*[.,]\d{2}(?!\d)|\d+[.,]\d{2}(?!\d)/g;
  const toNum = m => { const t = m.replace(/\s/g, ''), k = t.match(/^(.*)[.,](\d{2})$/); return k ? parseFloat(k[1].replace(/[.,]/g, '') + '.' + k[2]) : NaN; };
  const key = /TOPLAM|TOTAL|TOTALE|GESAMT|SUMME|IMPORTE|PAGAR|AMOUNT|TUTAR|BETRAG|TOTAAL|SUMA/i, skip = /SUB ?TOTAL|ARA ?TOPLAM|KDV|IVA|VAT|TAX|MWST|TVA/i;
  let amount = 0;
  for (const l of lines) if (key.test(l) && !skip.test(l)) for (const m of l.match(amtRe) || []){ const v = toNum(m); if (v > amount) amount = v; }
  if (!amount) for (const l of lines) for (const m of l.match(amtRe) || []){ const v = toNum(m); if (v > amount && v < 1e7) amount = v; }
  const T = text.toUpperCase();
  const currency = /€|EUR/.test(T) ? 'EUR' : /₺|\bTL\b|TRY/.test(T) ? 'TRY' : /£|GBP/.test(T) ? 'GBP' : /CHF/.test(T) ? 'CHF'
    : /USD|\$/.test(T) ? 'USD' : /RMB|CNY|元/.test(T) ? 'CNY' : /JPY|円|¥/.test(T) ? 'JPY' : null;
  const name = lines.find(l => /[A-Za-zÇĞİÖŞÜçğıöşü]{3,}/.test(l) && !/\d[.,]\d{2}/.test(l) && !key.test(l));
  // Baş harfler büyük; Türkçe harf yoksa yabancı fiştir, I → i (GIRALDA → Giralda).
  const lc = name && /[İŞĞÇÖÜışğçöü]/.test(name) ? 'tr' : 'en';
  const desc = name ? name.toLocaleLowerCase(lc).replace(/(^|\s)\S/g, c => c.toLocaleUpperCase(lc)).slice(0, 40) : null;
  // Ürün satırları: sonunda fiyat olan, toplam/vergi/ödeme satırı olmayan satırlar.
  const pay = /EFECTIVO|TARJETA|VISA|MASTER|CARD|CASH|CHANGE|CAMBIO|PAGO|CONTANTI|RESTO|KART|NAKİT|PARA ÜSTÜ|IBAN|TEL/i;
  const items = [];
  for (const l of lines){
    if (key.test(l) || skip.test(l) || pay.test(l)) continue;
    const m = l.match(amtRe); if (!m) continue;
    const price = toNum(m[m.length - 1]), name = l.slice(0, l.lastIndexOf(m[m.length - 1])).replace(/^\s*\d+\s*[xX*]\s*/, '').replace(/[^\p{L}\p{N} .&'-]/gu, ' ').replace(/\s+/g, ' ').trim();
    if (price > 0 && price < amount + .01 && name.length >= 2) items.push({name:name.slice(0, 40), price});
  }
  return {amount:amount || null, currency, desc, items:items.slice(0, 40)};
}
async function readReceipt(dataUrl){
  if (sampleFn && sampleImg){
    try {
      return await sampleFn.json('Bu fotoğraf bir harcama fişi ya da faturası. Ödenen TOPLAM tutarı, para birimini, 2-4 kelimelik kısa bir Türkçe açıklamayı (mağaza fişiyse mağaza adını) ve fişteki ürünleri (en fazla 30, adı ve satır tutarı) çıkar. '
      + 'Sadece şu biçimde JSON döndür: {"amount": 23.5, "currency": "EUR", "desc": "Restoranda akşam yemeği", "items": [{"name": "Tişört", "price": 19.99}]}. currency şunlardan biri olmalı: ' + CURS.map(c => c[0]).join(', ')
      + '. Toplam okunamıyorsa {"amount": null} döndür.', {images:[dataUrlToBlob(dataUrl)], modelTier:'quick'});
    } catch(e){
      // Claude kullanılamıyorsa (izin yok, kapalı) bundan sonra telefonda okunur.
      if (!['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'images_unavailable', 'refused'].includes(e && e.code)) throw e;
      sampleImg = false;
    }
  }
  if (IN_CLAUDE) throw {code:'noocr'};
  const Tess = await loadTess();
  // İndirme engellenirse sonsuza dek beklemesin.
  const {data} = await Promise.race([Tess.recognize(dataUrl, 'eng'), new Promise((_, no) => setTimeout(() => no({code:'timeout'}), 60000))]);
  return parseReceipt(data.text || '');
}
async function scanReceipt(){
  const f = form; if (!f || f.scanning) return;
  f.scanning = true; drawSheetKeep();
  if (!(sampleFn && sampleImg) && !IN_CLAUDE) toast('Fiş telefonda okunuyor; ilk seferde biraz sürebilir…');
  try {
    const r = await readReceipt(f.photo);
    if (form !== f) return;
    if (!r || !(Number(r.amount) > 0)) throw {code:'unreadable'};
    if (CURS.some(c => c[0] === r.currency) && r.currency !== f.cur) setCur(r.currency);
    f.amount = nf.format(Number(r.amount));
    if (f.mode === 'shop'){
      if (r.desc && !f.store.trim()) f.store = String(r.desc).slice(0, 40);
      if (Array.isArray(r.items) && r.items.length && !(f.lines || []).some(l => l.name))
        f.lines = r.items.filter(x => x && x.name && Number(x.price) > 0).slice(0, 40).map(x => ({name:String(x.name).slice(0, 40), price:nf.format(Number(x.price))}));
    }
    else if (r.desc && !f.desc.trim()){ f.desc = String(r.desc).slice(0, 60); if (!f.catManual) f.cat = guessCat(f.desc, S.learned); }
    toast('Fişten dolduruldu; tutarı bir kontrol et.');
  } catch(e){
    const c = e && e.code;

const LOGOS = {nike:'nike', adidas:'adidas', puma:'puma', zara:'zara', 'h&m':'handm', hm:'handm', 'new balance':'newbalance', newbalance:'newbalance',

function brandTile(store){
  const k = (store || '').trim().toLowerCase(), slug = LOGOS[k] || LOGOS[k.split(/\s+/)[0]] || LOGOS[k.split(/\s+/).slice(0, 2).join(' ')] || LOGOS[k.split(/\s+/).slice(0, 3).join(' ')];
  if (slug) return `<span class="ic brand logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${LOGO_PATHS[slug]}"/></svg></span>`;
  const ini = esc((store || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase());
  let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `<span class="ic brand" style="--h:${h}">${ini}</span>`;
}
function startShop(i){
  if (i) openSheet({mode:'shop', id:i.id, date:isoDay(i.at), tr:i.tr ? nf0.format(i.tr) : '', lines:(i.lines || []).map(l => ({name:l.name, price:nf.format(l.price), tr:l.tr ? nf0.format(l.tr) : ''})), store:i.store, outlet:i.outlet || '', amount:nf.format(i.amount), cur:i.cur, rate:i.cur === 'EUR' ? null : i.rate, noTF:!!i.noTF, photo:getShopPhoto(i.id), photoChanged:false});
  else openSheet({mode:'shop', date:isoDay(Date.now()), store:'', outlet:SH.outlet, amount:'', cur:'EUR', noTF:false, photo:null, photoChanged:false});
}

function linesHtml(){
  const L = form.lines || [];
  if (!L.length) return `<button type="button" class="link" data-act="addline">🧾 Fişteki ürünleri ekle</button>`;
  const sum = L.reduce((a, l) => a + (parseAmt(l.price) || 0), 0);
  return `<div class="f"><span class="lab">Fişteki ürünler (${L.length}) · ${money(sum, form.cur)}</span><div class="lines">`

function mergePerson(from, to){
  const order = id => S.people.findIndex(p => p.id === id);
  // Eski "payını gönderdi" işaretleri (tlPaid) kişi başına tutulur; iki kişi birleşince yarım işaret anlamsızlaşır.
  // Bu yüzden önce o işaretler, hesaplaşma kuruyla aynı tutarda ödeme kayıtlarına çevrilir (bakiyeler değişmez).
  const R = totalPlan().R;
  for (const {e, rows} of tlSplits(S)) for (const r of rows) if (r.paid && (r.id === from || r.id === to)){
    S.entries.push({id:uid(), kind:'transfer', total:true, from:r.id, to:e.paidBy, amount:r.amt / 100, cur:'TRY', rate:R, at:e.at, by:S.me, note:`Önceden gönderilen pay: ${e.desc}`});
    e.tlPaid = e.tlPaid.filter(x => x !== r.id);
  }
  for (const e of S.entries){
    for (const k of ['paidBy', 'by', 'from', 'to']) if (e[k] === from) e[k] = to;
    if ((e.among || []).includes(from)){
      const w = e.weights || {}, wf = w[from] || 1, wt = e.among.includes(to) ? (w[to] || 1) : 0;
      e.among = [...new Set(e.among.map(x => x === from ? to : x))].sort((a, b) => order(a) - order(b));
      const nw = {...w}; delete nw[from];

    }
    if (e.tlPaid) e.tlPaid = [...new Set(e.tlPaid.map(x => x === from ? to : x))].filter(x => x !== e.paidBy);
  }

}

function mixHex(a, b, t){ const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }

// --- tuval grafik çizimleri (PDF sayfası ve Excel görselleri ortak) ---
const FONT = (w, px) => `${w} ${px}px "Figtree", system-ui, sans-serif`;
function rr(x, X, Y, W, H, r){ x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + W, Y, X + W, Y + H, r); x.arcTo(X + W, Y + H, X, Y + H, r); x.arcTo(X, Y + H, X, Y, r); x.arcTo(X, Y, X + W, Y, r); x.closePath(); }
// Halka grafik + sağda lejant (renk, ad, tutar, yüzde).
function drawDonut(x, X, Y, R, cats, total, s = 1){
  const cx = X + R, cy = Y + R; let a = -Math.PI / 2;
  for (const c of cats){ const da = c.v / (total || 1) * Math.PI * 2; x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, R, a, a + da); x.closePath(); x.fillStyle = c.color; x.fill(); a += da; }
  // 2px zemin boşluğu ve ortası
  a = -Math.PI / 2; x.strokeStyle = '#fff'; x.lineWidth = 3 * s;
  for (const c of cats){ x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); x.stroke(); a += c.v / (total || 1) * Math.PI * 2; }
  x.beginPath(); x.arc(cx, cy, R * .58, 0, Math.PI * 2); x.fillStyle = '#fff'; x.fill();
  x.textAlign = 'center'; x.fillStyle = RPT.muted; x.font = FONT(500, 22 * s); x.fillText('Toplam', cx, cy - 8 * s);
  x.fillStyle = RPT.ink; x.font = FONT(800, 34 * s); x.fillText(eu(total), cx, cy + 30 * s); x.textAlign = 'left';
  let ly = Y + 10 * s; const lx = X + R * 2 + 50 * s;
  for (const c of cats){
    x.fillStyle = c.color; rr(x, lx, ly, 22 * s, 22 * s, 5 * s); x.fill();
    x.fillStyle = RPT.ink; x.font = FONT(600, 24 * s); x.fillText(c.name, lx + 36 * s, ly + 19 * s);
    x.fillStyle = RPT.muted; x.font = FONT(400, 22 * s); x.fillText(`${eu(c.v)} · %${Math.round(c.v * 100 / (total || 1))}`, lx + 220 * s, ly + 19 * s);
    ly += 40 * s;
  }
}
// Dikey çubuklar (tek seri): günlük harcama. En yüksek çubuk ve son gün etiketlenir.
function drawDays(x, X, Y, W, H, days, color, s = 1){
  if (!days.length) return;
  const max = Math.max(...days.map(d => d.v)), bw = Math.min(70 * s, (W - 20 * s) / days.length - 10 * s), gap = (W - bw * days.length) / (days.length + 1);
  x.strokeStyle = RPT.line; x.lineWidth = 2; x.beginPath(); x.moveTo(X, Y + H); x.lineTo(X + W, Y + H); x.stroke();
  days.forEach((d, i) => {
    const h = Math.max(4 * s, (d.v / max) * (H - 50 * s)), bx = X + gap + i * (bw + gap), by = Y + H - h;
    x.fillStyle = color; rr(x, bx, by, bw, h + 2, Math.min(6 * s, bw / 2)); x.fill();
    x.textAlign = 'center'; x.fillStyle = RPT.muted; x.font = FONT(400, 18 * s); x.fillText(d.label, bx + bw / 2, Y + H + 26 * s);
    if (d.v === max || days.length <= 8){ x.fillStyle = RPT.ink; x.font = FONT(700, 18 * s); x.fillText(nf0.format(Math.round(d.v / 100)) + ' €', bx + bw / 2, by - 10 * s); }
    x.textAlign = 'left';
  });
}
// Yatay gruplu çubuklar: kişi başına "payına düşen" (seri 1) ve "cebinden çıkan" (seri 2), lejantlı.
function drawPeople(x, X, Y, W, people, s = 1){
  const max = Math.max(1, ...people.flatMap(p => [p.share, p.paid])), nameW = 200 * s, bw = W - nameW - 150 * s;
  x.fillStyle = RPT.s1; rr(x, X, Y, 20 * s, 20 * s, 4 * s); x.fill(); x.fillStyle = RPT.ink; x.font = FONT(500, 20 * s); x.fillText('Payına düşen', X + 30 * s, Y + 17 * s);
  x.fillStyle = RPT.s2; rr(x, X + 220 * s, Y, 20 * s, 20 * s, 4 * s); x.fill(); x.fillStyle = RPT.ink; x.fillText('Cebinden çıkan', X + 250 * s, Y + 17 * s);
  let y = Y + 50 * s;
  for (const p of people){
    x.fillStyle = RPT.ink; x.font = FONT(600, 22 * s); x.fillText(p.name.length > 16 ? p.name.slice(0, 15) + '…' : p.name, X, y + 26 * s);
    [[p.share, RPT.s1, 0], [p.paid, RPT.s2, 24 * s]].forEach(([v, col, dy]) => {

// kahramanı, günün en büyüğü, bütçe, saat saat harcamalar), kim ne kadar ve kapanış (hesaplaşma).
async function svgImage(el){
  if (!el) return null;
  let s = new XMLSerializer().serializeToString(el);
  if (!/^<svg[^>]*xmlns=/.test(s)) s = s.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
  s = s.replace('<svg ', '<svg width="512" height="512" ');
  const u = URL.createObjectURL(new Blob([s], {type:'image/svg+xml'})), img = new Image();
  try { await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = u; }); return img; } catch(_) { return null; } finally { setTimeout(() => URL.revokeObjectURL(u), 1000); }
}

// Hesap kapanınca kısa bir kutlama; hareket azaltma ayarı açıksa gösterilmez.
function confetti(){
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch(_) {}
  const cs = getComputedStyle(document.documentElement), cols = ['--accent', '--sun', '--pos', '--neg'].map(v => cs.getPropertyValue(v).trim()).filter(Boolean);
  const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
  for (let i = 0; i < 90; i++){
    const b = document.createElement('i');
    b.style.left = Math.random() * 100 + '%'; b.style.background = cols[i % cols.length];
    b.style.animationDelay = Math.random() * .5 + 's'; b.style.animationDuration = 1.6 + Math.random() * 1.4 + 's';
    b.style.setProperty('--dx', Math.random() * 140 - 70 + 'px'); b.style.setProperty('--r', Math.random() * 900 + 'deg');
    box.appendChild(b);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 3600);
}

const help = k => `<button type="button" class="hq" data-help="${k}" aria-label="Bu ne?">?</button>`;
function toggleHelp(btn){

  const same = next && next.classList.contains('hbox') && next.dataset.k === btn.dataset.help;
  document.querySelectorAll('.hbox').forEach(x => x.remove());
  if (same) return;
  const box = document.createElement('div'); box.className = 'hbox'; box.dataset.k = btn.dataset.help; box.setAttribute('role', 'note');
  box.textContent = HELP[btn.dataset.help] || '';

// ---- kaydırarak silme ----
// Satır yatay kaydırılınca takip eder; yarıdan fazla kaydırılırsa açık kalır ve "Sil" görünür.
// Dikey hareket sayfayı kaydırır. Açık satıra ya da başka bir satıra dokunmak satırı kapatır.
const SW = 96;
let sw = null, swOpen = null, swEat = false;
function swSet(row, x, drag){ row.classList.toggle('drag', !!drag); row.style.transform = x ? `translateX(${x}px)` : ''; row._x = x; }
function swClose(){ if (swOpen && swOpen.isConnected) swSet(swOpen, 0); swOpen = null; }
document.addEventListener('pointerdown', ev => {
  swEat = false;
  if (isRO()){ sw = null; return; }
  const row = ev.target.closest('.swr > .row');
  if (swOpen && row !== swOpen && !ev.target.closest('.swdel')){ swClose(); if (row) swEat = true; }
  if (!row || ev.button > 0) return;
  sw = {row, id:ev.pointerId, x0:ev.clientX, y0:ev.clientY, base:row === swOpen ? row._x : 0, dx:0, on:false};
});
document.addEventListener('pointermove', ev => {
  if (!sw || ev.pointerId !== sw.id) return;
  const dx = ev.clientX - sw.x0, dy = ev.clientY - sw.y0;
  if (!sw.on){
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ sw = null; return; }
    if (Math.abs(dx) < 10) return;
    sw.on = true; try { sw.row.setPointerCapture(ev.pointerId); } catch(_) {}
  }
  sw.dx = Math.max(-SW * 1.4, Math.min(SW * 1.4, sw.base + dx));
  swSet(sw.row, sw.dx, true);
});
function swEnd(ev){
  if (!sw || ev.pointerId !== sw.id) return;
  const s = sw; sw = null;
  if (!s.on) return;
  swEat = true;                                   // kaydırmanın ardından gelen tıklama satırı açmasın
  const x = Math.abs(s.dx) > SW / 2 ? Math.sign(s.dx) * SW : 0;
  swSet(s.row, x); swOpen = x ? s.row : null;
}
document.addEventListener('pointerup', swEnd);
document.addEventListener('pointercancel', swEnd);

// Silinen kayıt birkaç saniye "Geri al" ile geri getirilebilir; süre dolunca fiş fotoğrafı da silinir.
let undo = null;
function finishUndo(){ if (!undo) return; clearTimeout(undo.timer); setPhoto(undo.e.id, null); undo = null; }
function swipeDelete(id){
  const e = S.entries.find(x => x.id === id); if (!e) return;
  if (e.kind === 'kasa' && kasaWouldGoNegative(e, true)){ swClose(); return toast('Bu kaydı silersen kasa eksiye düşer, çünkü bu para kasadan harcanmış.'); }
  finishUndo();
  const box = document.querySelector(`.swr [data-edit="${id}"]`)?.closest('.swr');
  if (box && !calm() && !box.dataset.going){
    // Satır önce sola kayıp kapanır, sonra kayıt silinir (alttakiler yukarı kayarak yerini alır).
    box.dataset.going = '1'; box.style.height = box.offsetHeight + 'px'; void box.offsetHeight;
    box.classList.add('going'); box.style.height = '0px';
    return setTimeout(() => { delete box.dataset.going; swipeDelete2(e); }, 230);
  }
  swipeDelete2(e);
}
function swipeDelete2(e){
  const i = S.entries.indexOf(e); if (i < 0) return;
  S.entries.splice(i, 1); swOpen = null; render();
  logEvent(`sildi: ${e.kind === 'expense' ? e.desc : 'kayıt'} · ${money(e.amount, e.cur)}`);
  undo = {e, i, tid:S.tid, timer:setTimeout(finishUndo, 6000)};
  toast(`${e.kind === 'expense' ? e.desc : 'Kayıt'} silindi`, {act:'undo', label:'Geri al', ms:6000});
}
function showPhoto(src){
  const v = document.createElement('div'); v.className = 'viewer';
  v.innerHTML = `<img alt="Fiş fotoğrafı"><button class="x" aria-label="Kapat">×</button>`;
  v.querySelector('img').src = src;

}
