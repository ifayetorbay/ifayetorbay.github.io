// ---- raporlar ----
// Excel: ExcelJS ile gerçek .xlsx (Özet + gömülü grafikler, Harcamalar, Kategoriler, Kişiler, Günlük, Hesaplaşma);
// kütüphane indirilemezse noktalı virgüllü CSV. PDF: A4 sayfalar tuvale çizilir (Türkçe harfler sorunsuz), jsPDF ile
// birleştirilir. Dosya, yapıtın indirme izniyle kaydedilir (görüntüleyene sorulur).
// Grafik renkleri: kategori başına sabit, renk körlüğüne dayanıklı doğrulanmış palet (renk kategoriye bağlı, sırasına değil);
// açık renklerin zemin kontrastı düşük olduğundan her grafikte değerler yazıyla da verilir.
let dlCap;
async function saveFile(filename, data){
  if (dlCap === undefined){ try { dlCap = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch(_) { dlCap = null; } }
  if (dlCap){ try { await dlCap.save({filename, data}); return true; } catch(e){ if (e && e.code === 'declined') return false; } }
  try { const u = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); const a = document.createElement('a'); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return true; }
  catch(_) { toast('Dosya indirilemedi.'); return false; }
}
const fileBase = () => (S.trip.name || 'seyahat').replace(/[^\p{L}\p{N} _-]/gu, '').trim().replace(/\s+/g, '-') || 'seyahat';
function exportCsv(){
  const q = v => { const t = String(v == null ? '' : v); return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const d2 = t => new Date(t).toLocaleDateString('tr-TR');
  const rows = [['Tarih', 'Açıklama', 'Kategori', 'Dönem', 'Ödeyen', 'Bölüşülen', 'Tutar', 'Para birimi', 'Euro', 'TL (girildiği gün)']];
  S.entries.filter(e => e.kind === 'expense').sort((a, b) => a.at - b.at).forEach(e => rows.push([d2(e.at), e.desc, catById(e.cat).name, phaseOf(e, S) === 'pre' ? 'Seyahat öncesi' : 'Seyahatte',
    e.paidBy === 'kasa' ? 'Ortak kasa' : rawName(e.paidBy), e.among.map(id => rawName(id) + (e.weights && e.weights[id] > 1 ? ' ×' + e.weights[id] : '')).join(', '),
    nf.format(e.amount), e.cur, nf.format(toCents(e) / 100), nf.format(tlKurus(e) / 100)]));
  const pays = S.entries.filter(e => e.kind === 'transfer').sort((a, b) => a.at - b.at);
  if (pays.length){ rows.push([]); rows.push(['Yapılan ödemeler']); rows.push(['Tarih', 'Kimden', 'Kime', 'Tutar', 'Para birimi', 'Not']); pays.forEach(e => rows.push([d2(e.at), rawName(e.from), rawName(e.to), nf.format(e.amount), e.cur, e.note || ''])); }
  if (!isFamily()){ const {plan} = totalPlan(); rows.push([]); rows.push(['Kalan hesaplaşma']); rows.push(['Kimden', 'Kime', 'TL']); plan.forEach(p => rows.push([rawName(p.from), rawName(p.to), nf.format(p.amt / 100)])); if (!plan.length) rows.push(['Herkes denk']); }
  const csv = '\ufeff' + rows.map(r => r.map(q).join(';')).join('\r\n');
  saveFile(fileBase() + '-harcamalar.csv', new Blob([csv], {type:'text/csv;charset=utf-8'})).then(ok => ok && toast('📊 Excel dosyası hazır.'));
}
const CAT_COLORS = {ucak:'#2a78d6', ulasim:'#eb6834', yeme:'#1baf7a', konaklama:'#eda100', aktivite:'#e87ba4', market:'#008300', alisveris:'#6250d6', diger:'#e34948'};
const RPT = {ink:'#13232C', muted:'#5B6A74', line:'#D5DDE2', soft:'#F1F4F5', s1:'#2a78d6', s2:'#eb6834'};
function mixHex(a, b, t){ const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function reportData(){
  const C = compute(S), tc = themeCountry(), accent = tc ? tc[2] : '#0B6B6B';
  const cats = CATS.map(c => ({id:c.id, name:c.name, v:C.cats[c.id] || 0, color:CAT_COLORS[c.id]})).filter(c => c.v > 0).sort((a, b) => b.v - a.v);
  const days = {};
  S.entries.filter(e => e.kind === 'expense' && phaseOf(e, S) !== 'pre').forEach(e => { const k = isoDay(e.at); days[k] = (days[k] || 0) + toCents(e); });
  const dayList = Object.keys(days).sort().map(k => { const t = new Date(k + 'T12:00:00').getTime(), n = tripDay(t); return {key:k, label:n >= 1 ? n + '. gün' : new Date(t).toLocaleDateString('tr-TR', {day:'numeric', month:'short'}), v:days[k]}; });
  const people = S.people.map(p => ({id:p.id, name:p.name, share:C.share[p.id] || 0, paid:C.paid[p.id] || 0}));
  const tp = isFamily() ? {plan:[], R:S.trip.rate} : totalPlan();
  return {C, n:headcount(), accent, cats, dayList, people, plan:tp.plan, R:tp.R};
}
// --- tuval grafik çizimleri (PDF sayfası ve Excel görselleri ortak) ---
const FONT = (w, px) => `${w} ${px}px "Figtree", system-ui, sans-serif`;
function rr(x, X, Y, W, H, r){ x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + W, Y, X + W, Y + H, r); x.arcTo(X + W, Y + H, X, Y + H, r); x.arcTo(X, Y + H, X, Y, r); x.arcTo(X, Y, X + W, Y, r); x.closePath(); }
// Halka grafik + sağda lejant (renk, ad, tutar, yüzde).
function drawDonut(x, X, Y, R, cats, total, s = 1){
  const cx = X + R, cy = Y + R; let a = -Math.PI / 2;
  for (const c of cats){ const da = c.v / (total || 1) * Math.PI * 2; x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, R, a, a + da); x.closePath(); x.fillStyle = c.color; x.fill(); a += da; }
  // 2px zemin boşluğu ve ortası
  a = -Math.PI / 2; x.strokeStyle = '#fff'; x.lineWidth = 3 * s;
  for (const c of cats){ x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); x.stroke(); a += c.v / (total || 1) * Math.PI * 2; }
  x.beginPath(); x.arc(cx, cy, R * .58, 0, Math.PI * 2); x.fillStyle = '#fff'; x.fill();
  x.textAlign = 'center'; x.fillStyle = RPT.muted; x.font = FONT(500, 22 * s); x.fillText('Toplam', cx, cy - 8 * s);
  x.fillStyle = RPT.ink; x.font = FONT(800, 34 * s); x.fillText(eu(total), cx, cy + 30 * s); x.textAlign = 'left';
  let ly = Y + 10 * s; const lx = X + R * 2 + 50 * s;
  for (const c of cats){
    x.fillStyle = c.color; rr(x, lx, ly, 22 * s, 22 * s, 5 * s); x.fill();
    x.fillStyle = RPT.ink; x.font = FONT(600, 24 * s); x.fillText(c.name, lx + 36 * s, ly + 19 * s);
    x.fillStyle = RPT.muted; x.font = FONT(400, 22 * s); x.fillText(`${eu(c.v)} · %${Math.round(c.v * 100 / (total || 1))}`, lx + 220 * s, ly + 19 * s);
    ly += 40 * s;
  }
}
// Dikey çubuklar (tek seri): günlük harcama. En yüksek çubuk ve son gün etiketlenir.
function drawDays(x, X, Y, W, H, days, color, s = 1){
  if (!days.length) return;
  const max = Math.max(...days.map(d => d.v)), bw = Math.min(70 * s, (W - 20 * s) / days.length - 10 * s), gap = (W - bw * days.length) / (days.length + 1);
  x.strokeStyle = RPT.line; x.lineWidth = 2; x.beginPath(); x.moveTo(X, Y + H); x.lineTo(X + W, Y + H); x.stroke();
  days.forEach((d, i) => {
    const h = Math.max(4 * s, (d.v / max) * (H - 50 * s)), bx = X + gap + i * (bw + gap), by = Y + H - h;
    x.fillStyle = color; rr(x, bx, by, bw, h + 2, Math.min(6 * s, bw / 2)); x.fill();
    x.textAlign = 'center'; x.fillStyle = RPT.muted; x.font = FONT(400, 18 * s); x.fillText(d.label, bx + bw / 2, Y + H + 26 * s);
    if (d.v === max || days.length <= 8){ x.fillStyle = RPT.ink; x.font = FONT(700, 18 * s); x.fillText(nf0.format(Math.round(d.v / 100)) + ' €', bx + bw / 2, by - 10 * s); }
    x.textAlign = 'left';
  });
}
// Yatay gruplu çubuklar: kişi başına "payına düşen" (seri 1) ve "cebinden çıkan" (seri 2), lejantlı.
function drawPeople(x, X, Y, W, people, s = 1){
  const max = Math.max(1, ...people.flatMap(p => [p.share, p.paid])), nameW = 200 * s, bw = W - nameW - 150 * s;
  x.fillStyle = RPT.s1; rr(x, X, Y, 20 * s, 20 * s, 4 * s); x.fill(); x.fillStyle = RPT.ink; x.font = FONT(500, 20 * s); x.fillText('Payına düşen', X + 30 * s, Y + 17 * s);
  x.fillStyle = RPT.s2; rr(x, X + 220 * s, Y, 20 * s, 20 * s, 4 * s); x.fill(); x.fillStyle = RPT.ink; x.fillText('Cebinden çıkan', X + 250 * s, Y + 17 * s);
  let y = Y + 50 * s;
  for (const p of people){
    x.fillStyle = RPT.ink; x.font = FONT(600, 22 * s); x.fillText(p.name.length > 16 ? p.name.slice(0, 15) + '…' : p.name, X, y + 26 * s);
    [[p.share, RPT.s1, 0], [p.paid, RPT.s2, 24 * s]].forEach(([v, col, dy]) => {
      const w = Math.max(3 * s, v / max * bw); x.fillStyle = col; rr(x, X + nameW, y + dy, w, 20 * s, 4 * s); x.fill();
      x.fillStyle = RPT.muted; x.font = FONT(500, 18 * s); x.fillText(eu(v), X + nameW + w + 10 * s, y + dy + 16 * s);
    });
    y += 66 * s;
  }
  return y;
}
function chartImage(w, h, draw){ const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); draw(x); return c.toDataURL('image/png'); }

// --- Excel ---
function loadLib(src, name){
  loadLib.p = loadLib.p || {};
  return loadLib.p[src] || (loadLib.p[src] = new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src;
    sc.onload = () => window[name] ? ok(window[name]) : no(new Error('yok')); sc.onerror = () => { delete loadLib.p[src]; no(new Error('indirilemedi')); }; document.head.appendChild(sc); }));
}

// --- PDF ---
async function exportPdf(){
  toast('📄 PDF hazırlanıyor…');
  let jsPDF; try { jsPDF = (await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'jspdf')).jsPDF; } catch(_) { return toast('PDF aracı indirilemedi; Excel dosyasını deneyebilirsin.'); }
  const pages = pdfPages();
  const doc = new jsPDF({unit:'pt', format:'a4'});
  pages.forEach((p, i) => { if (i) doc.addPage(); doc.addImage(p.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, 595.28, 841.89); });
  const ok = await saveFile(fileBase() + '-rapor.pdf', doc.output('blob'));
  if (ok) toast('📄 PDF hazır.');
}
// A4 sayfaları (1240×1754, 150 dpi): 1) başlık, özet kutuları, kategori halkası, günlük çubuklar;
// 2) kişiler, hesaplaşma, bütçe; 3+) harcamalar tablosu.
function pdfPages(){
  const W = 1240, H = 1754, M = 80, D = reportData(), C = D.C, pages = []; let cv, x, y;
  const page = () => { cv = document.createElement('canvas'); cv.width = W; cv.height = H; x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); y = M; pages.push(cv); };
  const title = (t, px = 34) => { if (y + 80 > H - M) page(); x.fillStyle = RPT.ink; x.font = FONT(800, px); x.fillText(t, M, y + px); y += px + 26; };
  const fit = (t, max, font) => { x.font = font; let s = String(t); if (x.measureText(s).width <= max) return s; while (s.length > 2 && x.measureText(s + '…').width > max) s = s.slice(0, -1); return s + '…'; };
  page();
  // başlık bandı (bayrak rengi)
  x.fillStyle = D.accent; x.fillRect(0, 0, W, 230);
  x.fillStyle = '#fff'; x.font = FONT(800, 58); x.fillText(fit(S.trip.name, W - 2 * M, FONT(800, 58)), M, 110);
  x.font = FONT(500, 26); x.globalAlpha = .9;
  x.fillText(fit(`${tripRange(S.trip) || ''}${S.trip.start ? '  ·  ' : ''}${isFamilies() ? D.people.length + ' aile · ' + D.n + ' kişi' : D.n + ' kişi'}  ·  ${S.people.map(p => p.name).join(', ')}`, W - 2 * M, FONT(500, 26)), M, 160);
  x.font = FONT(400, 20); x.fillText(`Hazırlanma: ${new Date().toLocaleString('tr-TR')}${isRO() ? '  ·  Arşiv' : ''}`, M, 200); x.globalAlpha = 1;

async function svgImage(el){
  if (!el) return null;
  let s = new XMLSerializer().serializeToString(el);
  if (!/^<svg[^>]*xmlns=/.test(s)) s = s.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
  s = s.replace('<svg ', '<svg width="512" height="512" ');
  const u = URL.createObjectURL(new Blob([s], {type:'image/svg+xml'})), img = new Image();
  try { await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = u; }); return img; } catch(_) { return null; } finally { setTimeout(() => URL.revokeObjectURL(u), 1000); }
}

  if (stores.length > 7) donut.push({name:'Diğer', v:stores.slice(7).reduce((a, s0) => a + s0.v, 0), color:PAL[7]});

  const ops = opGroups(ref), opRank = Object.fromEntries(ops.map((o, k) => [o.op, k]));
  const groups = Object.values(gm).sort((a, b) => opRank[a.op] - opRank[b.op] || a.at - b.at);
  const cs = items.map(i => trCompare(i, ref[i.id])).filter(Boolean), gain = cs.reduce((a, c) => a + c.tr - c.net, 0);

}

// Hesap kapanınca kısa bir kutlama; hareket azaltma ayarı açıksa gösterilmez.
function confetti(){
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch(_) {}
  const cs = getComputedStyle(document.documentElement), cols = ['--accent', '--sun', '--pos', '--neg'].map(v => cs.getPropertyValue(v).trim()).filter(Boolean);
  const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
  for (let i = 0; i < 90; i++){
    const b = document.createElement('i');
    b.style.left = Math.random() * 100 + '%'; b.style.background = cols[i % cols.length];
    b.style.animationDelay = Math.random() * .5 + 's'; b.style.animationDuration = 1.6 + Math.random() * 1.4 + 's';
    b.style.setProperty('--dx', Math.random() * 140 - 70 + 'px'); b.style.setProperty('--r', Math.random() * 900 + 'deg');
    box.appendChild(b);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 3600);
}

// ---- kaydırarak silme ----
// Satır yatay kaydırılınca takip eder; yarıdan fazla kaydırılırsa açık kalır ve "Sil" görünür.
// Dikey hareket sayfayı kaydırır. Açık satıra ya da başka bir satıra dokunmak satırı kapatır.
const SW = 96, SWROW = '.swr > .row, .swr > .srow2, .swr > .grow, .swr > .pli';   // kayan satırlar: kayıt, alışveriş, hediye
let sw = null, swOpen = null, swEat = false;
function swSet(row, x, drag){ row.classList.toggle('drag', !!drag); row.style.transform = x ? `translateX(${x}px)` : ''; row._x = x; }
function swClose(){ if (swOpen && swOpen.isConnected) swSet(swOpen, 0); swOpen = null; }
document.addEventListener('pointerdown', ev => {
  swEat = false;
  if (isRO()){ sw = null; return; }
  const row = ev.target.closest(SWROW);
  if (swOpen && row !== swOpen && !ev.target.closest('.swdel')){ swClose(); if (row) swEat = true; }
  if (!row || ev.button > 0) return;
  // Arkasında görünür "Sil" yoksa (ör. yetkisi olmayana katılımcı satırı) satır kaymaz, boşluk açılmaz.
  const del = row.parentElement.querySelector('.swdel');
  if (!del || getComputedStyle(del).display === 'none') return;
  sw = {row, id:ev.pointerId, x0:ev.clientX, y0:ev.clientY, base:row === swOpen ? row._x : 0, dx:0, on:false};
});
document.addEventListener('pointermove', ev => {
  if (!sw || ev.pointerId !== sw.id) return;
  const dx = ev.clientX - sw.x0, dy = ev.clientY - sw.y0;
  if (!sw.on){
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ sw = null; return; }
    if (Math.abs(dx) < 10) return;
    sw.on = true; try { sw.row.setPointerCapture(ev.pointerId); } catch(_) {}
  }
  sw.dx = Math.max(-SW * 1.4, Math.min(SW * 1.4, sw.base + dx));
  swSet(sw.row, sw.dx, true);
});
function swEnd(ev){
  if (!sw || ev.pointerId !== sw.id) return;
  const s = sw; sw = null;
  if (!s.on) return;
  swEat = true;                                   // kaydırmanın ardından gelen tıklama satırı açmasın
  const x = Math.abs(s.dx) > SW / 2 ? Math.sign(s.dx) * SW : 0;
  swSet(s.row, x); swOpen = x ? s.row : null;
}
document.addEventListener('pointerup', swEnd);
document.addEventListener('pointercancel', swEnd);

// ---- aşağı çekerek kapatma ----
// Pencere en üstteyken ya da her zaman sabit başlığından (tutamak, ad, ×) aşağı çekilince parmağı izler; 110 px'ten fazla ya da hızlı bir fiskeyle
// çekilirse kapanır (× ile aynı), yoksa yerine döner. iPhone'da Safari aşağı çekişi kendi esneme kaydırmasına çok erken
// alıyor: bu yüzden aşağı yöndeki ilk harekette sahiplenilir (en üstte aşağı kaydırmanın zaten işi yok). Yukarı kaydırma,
// yana kaydırma (satır silme) ve yazı/seçim kutuları etkilenmez.
let pull = null;
document.addEventListener('touchstart', ev => {
  const sh = ev.target.closest && ev.target.closest('.scrim:not(.closing) .sheet');
  pull = null;
  if (!sh || ev.touches.length > 1 || ev.target.closest('textarea, select, input[type=range]')) return;
  const head = !!ev.target.closest('.shead');
  if (!head && sh.scrollTop > 1) return;
  const t = ev.touches[0]; pull = {sh, head, y0:t.clientY, x0:t.clientX, t0:Date.now(), dy:0, on:false};
}, {passive:true});
document.addEventListener('touchmove', ev => {
  if (!pull) return;
  const t = ev.touches[0], dy = t.clientY - pull.y0, dx = t.clientX - pull.x0;
  if (!pull.on){
    if (dy < 0 || Math.abs(dx) > Math.abs(dy) + 2 || (!pull.head && pull.sh.scrollTop > 1)){ if (dy < -2 || Math.abs(dx) > 6) pull = null; return; }
    if (dy < 3) return;                               // küçük titreme: kaydırmayı engelleme
    if (ev.cancelable) ev.preventDefault();          // Safari esneme kaydırmasını başlatmasın
    if (dy < 6) return;
    pull.on = true; pull.sh.style.transition = 'none';
  }
  pull.dy = Math.max(0, dy - 6); pull.sh.style.transform = `translateY(${pull.dy}px)`; if (ev.cancelable) ev.preventDefault();
}, {passive:false});
function pullEnd(){
  const p = pull; pull = null; if (!p || !p.on) return;
  const fast = p.dy > 40 && p.dy / Math.max(1, Date.now() - p.t0) > 0.6;
  p.sh.style.transition = 'transform .2s ease';
  if (p.dy > 110 || fast){ p.sh.style.transform = 'translateY(100%)'; setTimeout(() => { if (p.sh.isConnected) closeSheet(true); }, 190); }
  else { p.sh.style.transform = ''; setTimeout(() => { p.sh.style.transition = ''; }, 220); }
}
document.addEventListener('touchend', pullEnd);
document.addEventListener('touchcancel', pullEnd);

// Kaydırarak silinen harcama, kasa kaydı ya da ödeme 6 saniye "Geri al" ile geri gelir; süre dolunca fiş fotoğrafı da silinir.
function swipeDelete(id){
  const e = S.entries.find(x => x.id === id); if (!e) return;
  if (e.kind === 'kasa' && kasaWouldGoNegative(e, true)){ swClose(); return toast('Bu kaydı silersen kasa eksiye düşer, çünkü bu para kasadan harcanmış.'); }
  swipeGone(`.swr [data-edit="${id}"]`, () => {
    const i = S.entries.indexOf(e); if (i < 0) return;
    const what = e.kind === 'expense' ? e.desc : 'kayıt';
    softDelete(e.kind === 'expense' ? e.desc : 'Kayıt',
      () => { S.entries.splice(S.entries.indexOf(e), 1); logEvent(`sildi: ${what} · ${money(e.amount, e.cur)}`); },
      () => { if (!S.entries.some(x => x.id === e.id)) S.entries.splice(Math.min(i, S.entries.length), 0, e); logEvent(`geri getirdi: ${what}`); },
      () => setPhoto(e.id, null));
  });
}

  if (d.del){ swipeDelete(d.del); return; }

  if (d.shop){ startShop(SH.items.find(i => i.id === d.shop)); return; }
  if (d.shopview){
    psegFrom = PSEG.findIndex(x => x[0] === shopView); shopView = d.shopview; render();

  }

  if (d.delshop){ shopDelete(d.delshop); return; }

  if (d.solo){ startSolo(SH.solo.find(x => x.id === d.solo)); return; }
  if (d.gift){ const g = SH.gifts.find(x => x.id === d.gift); g.done = !g.done; saveShop(); render(); if (g.done) toast(`🎁 ${g.who} için alındı`); return; }
  if (d.tf){ openSheet({mode:'tfform', iid:d.tf}); return; }
  // Tax-free formu penceresi: şirket ve adım tek dokunuşla; aynı mağaza + gün formundaki bütün alışverişlere yazılır.
  if (d.tfop !== undefined || d.tfst !== undefined){
    const i = SH.items.find(x => x.id === form.iid); if (!i) return;
    const grp = SH.items.filter(x => shopGroup(x) === shopGroup(i));
    if (d.tfop !== undefined) grp.forEach(x => { if (d.tfop) x.op = d.tfop; else delete x.op; });
    else { const st = +d.tfst; grp.forEach(x => setStep(x, st)); if (st === 1) toast('Formu sakla; AB’den son çıkışta gümrükte onaylat.'); if (st === 3) toast('İade alındı 💶'); }

  }
  if (d.help){ toggleHelp(t); return; }
  if (d.plancur){ planDraft.cur = d.plancur; render(); const i = document.getElementById('planInp'); if (i) i.focus(); return; }
  if (d.edit && swOpen === t){ swClose(); return; }
  if (d.act !== 'deltrip') confirmTrip = false;
  if (d.tab){ tab = d.tab; render(); window.scrollTo(0,0); if (tab === 'settle' && Date.now() - S.trip.rateAt > 30*6e4) fetchRate(false); return; }
  if (d.trip){ closeSheet(); switchTrip(d.trip); return; }
  if (d.emo){ openSheet({mode:'emoji', pid:d.emo}); return; }
  if (d.pickemo){
    const p = person(form && form.pid); if (!p.id) return;

  }
  if (d.release){
    const self = person(d.release).uid === myUid && selfFixLeft() > 0;

  if (d.edit){

  if (form){

    if (d.phase){

    if (d.all){ form.among = S.people.map(p => p.id); form.weights = defaultWeights(); drawSheetKeep(); return; }
    if (d.among){ const i = form.among.indexOf(d.among); if (i >= 0) form.among.splice(i,1); else form.among.push(d.among); form.among.sort((a,b) => S.people.findIndex(p=>p.id===a) - S.people.findIndex(p=>p.id===b)); drawSheetKeep(); return; }
    if (d.every){ form.everyone = true; drawSheetKeep(); return; }
    if (d.from){ form.everyone = false; form.from = d.from; drawSheetKeep(); return; }
    if (d.rm){ form.names.splice(+d.rm, 1); if (form.extra) form.extra.splice(+d.rm, 1); drawSheetKeep(); return; }
    if (d.nkind){ form.kind = d.nkind; drawSheetKeep(); return; }
    if (d.ptarget){ form.target = d.ptarget; drawSheetKeep(); return; }
    if (d.nfam !== undefined){
      const x = ((form.extra = form.extra || [])[+d.nfam] = form.extra[+d.nfam] || {}), k = d.fk, min = k === 'size' ? 1 : 0;
      x[k] = (x[k] || min) >= 9 ? min : (x[k] || min) + 1; drawSheetKeep(); return;
    }
    if (d.kind){
      // Tür değişince yazılmış tutar, para birimi ve açıklama korunur.
      const keep = {amount:form.amount || '', cur:form.cur, desc:form.desc || ''};
      if (d.kind === 'pay' && form.mode !== 'transfer') startPay();
      else if (d.kind === 'exp' && form.mode !== 'expense'){ startExpense(); Object.assign(form, keep, keep.desc ? {cat:guessCat(keep.desc, S.learned)} : {}); drawSheetKeep(); }
      else if (d.kind === 'solo' && form.mode !== 'solo') openSheet({mode:'solo', ...keep, rate:null, date:isoDay(Date.now())});
      return;
    }
    if (d.pfrom || d.pto){
      if (d.pfrom){ form.from = d.pfrom; if (form.to === d.pfrom){ const p = totalPlan().plan.find(q => q.from === d.pfrom); form.to = p ? p.to : (S.people.find(q => q.id !== d.pfrom) || {}).id; } }
      else form.to = d.pto;
      if (form.autoAmt) form.amount = payDefault(form.from, form.to);
      if (!form.noteManual) form.note = payNote(form.from, form.to);
      drawSheetKeep(); return;
    }
    if (d.lrm !== undefined){ form.lines.splice(+d.lrm, 1); drawSheetKeep(); return; }
    if (d.wid){ const w = form.weights || (form.weights = {}); w[d.wid] = Math.min(9, Math.max(1, (w[d.wid] || 1) + +d.dw)); drawSheetKeep(); return; }
  }
  const planAt = i => totalPlan().plan[+i];
  switch (d.act){
    case 'add': startExpense(); break;
    case 'addshop': startShop(); break;
    case 'addgift': {
      if (!giftDraft.who.trim() && !giftDraft.what.trim()){ toast('Kime ve ne alacağını yaz.'); break; }
      const est = parseAmt(giftDraft.est);
      SH.gifts.push({id:uid(), who:giftDraft.who.trim() || '—', what:giftDraft.what.trim(), est:est > 0 ? est : 0, done:false});
      giftDraft = {who:'', what:'', est:''}; saveShop(); render(); { const i = document.getElementById('gWho'); if (i) i.focus(); } break;
    }
    case 'addline': (form.lines = form.lines || []).push({name:'', price:''}); drawSheetKeep(); { const r = document.querySelectorAll('[data-lf=name]'); if (r.length) r[r.length - 1].focus(); } break;
    case 'shoplimit': editShopLimit = true; render(); { const i = document.getElementById('shLimit'); if (i){ i.focus(); i.select(); } } break;
    case 'saveshoplimit': { const i = document.getElementById('shLimit'), n = parsePlan(i ? i.value : ''); SH.limit = n > 0 ? Math.round(n) : 0; editShopLimit = false; saveShop(); render(); break; }
    case 'pay': startPay(); break;
    case 'kasa': openSheet({mode:'kasa', amount:'', cur:'EUR', from:S.me, everyone:true}); break;
    case 'kasaempty': openSheet({mode:'kasaempty'}); break;
    case 'kasaback': {
      const now = Date.now();
      kasaBackPlan().forEach(([id, c]) => S.entries.push({id:uid(), kind:'kasaout', from:'kasa', to:id, amount:c/100, cur:'EUR', rate:S.trip.rate, at:now, by:S.me}));
      closeSheet(); render(); toast('Kasada kalan para geri dağıtıldı'); break;
    }
    case 'kasawipe':
      if (!confirmDel){ confirmDel = true; drawSheetKeep(); break; }
      S.entries = S.entries.filter(e => e.kind !== 'kasa' && e.kind !== 'kasaout')
        .map(e => e.kind === 'expense' && e.paidBy === 'kasa' ? {...e, paidBy:S.trip.holder} : e);
      closeSheet(); render(); toast('Kasa kayıtları silindi'); break;
    case 'close': closeSheet(); break;
    case 'helpclose': t.closest('.hbox').remove(); break;
    case 'editplan':
      editPlan = true; planDraft = {v:S.trip.plan ? nf0.format(S.trip.plan) : '', cur:planCurOf()}; render();
      { const i = document.getElementById('planInp'); if (i){ i.focus(); i.select(); } } break;
    case 'saveplan': savePlan(); break;
    case 'errcopy':
      copyText(`Heybe hata kaydı · ${navigator.userAgent}\n` + errLog().map(e => `${new Date(e.t).toISOString()} [${e.tab}${e.f ? '/' + e.f : ''}] ${e.m} @ ${e.w}`).join('\n'), 'Hata kaydı kopyalandı; bana yapıştırıp gönderebilirsin.'); break;
    case 'errclear': try { localStorage.removeItem(ERR_KEY); } catch(_) {} render(); break;
    case 'plancopy': copyText(planText(), 'Plan kopyalandı; WhatsApp grubuna yapıştırabilirsin.'); break;
    case 'plan': openSheet({mode:'plan'}); break;
    case 'icsout': icsOut(); break;
    case 'planpdf': planPdf(); break;
    case 'icsapply': icsApply(); break;
    case 'icscancel': form.ics = null; drawSheetKeep(); break;
    case 'gundo':
      if (gUndo && gUndo.tid === S.tid){ const r = gUndo.restore; clearTimeout(gUndo.timer); gUndo = null; r(); render(); toast('Geri alındı'); }
      break;
    case 'save': submit(); break;
    case 'rate': fetchRate(true); break;
    case 'viewphoto': showPhoto(form.photo); break;
    case 'rmphoto': form.photo = form.photoHi = form.photoMid = null; form.photoChanged = true; saveDraftPhoto(null); drawSheetKeep(); break;
    case 'togglecat': form.showCat = !form.showCat; drawSheetKeep(); break;
    case 'togglepayer': form.showPayer = !form.showPayer; drawSheetKeep(); break;
    case 'toggleamong': form.showAmong = !form.showAmong; drawSheetKeep(); break;
    case 'toggleweights': form.showW = !form.showW; drawSheetKeep(); break;
    case 'scan': scanReceipt(); break;
    case 'sharestory': shareStory(); break;
    case 'pdf': exportPdf(); break;
    case 'album': exportAlbum(); break;
    case 'xlsx': exportXlsx(); break;
    case 'shoppdf': exportShopPdf(); break;
    case 'shopxlsx': exportShopXlsx(); break;
    case 'forgetlearn':
      if (!forgetSure){ forgetSure = true; render(); break; }
      forgetSure = false; RC_LEARN.clear(); RC_LINES.clear(); saveLearn(); render(); toast('Öğrenilenler silindi; fişler yine sözlükle okunacak.'); break;
    case 'plus': { const i = document.getElementById('fAmt'); if (i){ i.value = i.value.replace(/[+\s]*$/, '') + '+'; form.amount = i.value; i.focus(); } break; }
    case 'setmode':
      if (!canSetMode()){ toast('Seyahat başladı; hesaplaşma şekli artık sabit.'); render(); break; }
      S.trip.settleMode = d.m === 'min' ? 'min' : 'direct'; render();
      logEvent(d.m === 'min' ? 'hesaplaşmayı “daha az ödeme”ye aldı' : 'hesaplaşmayı “doğrudan ödeme”ye aldı');
      toast(d.m === 'min' ? 'Daha az ödemeyle gösteriliyor; herkesin toplamı aynı.' : 'Doğrudan ödemeye dönüldü.'); break;
    case 'editrate': form.showRate = true; drawSheetKeep(); { const r = document.getElementById('fRate'); if (r){ r.focus(); r.select(); } } break;
    case 'rmplace': Object.assign(form, {place:null, lat:null, lon:null, placeState:'off'}); drawPlace(); break;
    case 'destedit': form.destEdit = true; form.destDraft = null; drawPlace(); { const i = document.getElementById('fDest'); if (i){ i.focus(); i.select(); } } break;
    case 'destok': { const v = String(form.destDraft ?? document.getElementById('fDest')?.value ?? '').trim(), g = guessDest(form.desc, form.cat, form);
      form.dest = v && !(g && v === g.label) && !(form.lat && v === form.place) ? v.slice(0, 150) : null; form.destEdit = false; drawPlace(); break; }
    case 'destclear': form.dest = null; form.destEdit = false; drawPlace(); break;
    case 'locate': locate(form); document.getElementById('fPlace').innerHTML = placeHtml(); break;
    case 'del':
      if (form.mode === 'solo'){
        if (!confirmDel){ confirmDel = true; drawSheetKeep(); break; }
        SH.solo = SH.solo.filter(x => x.id !== form.id); saveShop(); closeSheet(); render(); toast('Silindi'); break;
      }
      if (form.mode === 'shop'){
        if (!confirmDel){ confirmDel = true; drawSheetKeep(); break; }
        SH.items = SH.items.filter(i => i.id !== form.id); setShopPhoto(form.id, null); saveShop(); closeSheet(); render(); toast('Silindi'); break;
      }
      { const old = S.entries.find(x => x.id === form.id);
        if ((old.kind === 'kasa') && kasaWouldGoNegative(old, true)){ document.getElementById('fErr').textContent = 'Bu kaydı silersen kasa eksiye düşer, çünkü bu para kasadan harcanmış. Tüm kasayı sıfırlamak için “Kasayı boşalt”ı kullan.'; break; } }
      if (!confirmDel){ confirmDel = true; drawSheetKeep(); break; }
      setPhoto(form.id, null);
      { const g = S.entries.find(x => x.id === form.id); logEvent(`sildi: ${g.kind === 'expense' ? g.desc : 'kayıt'} · ${money(g.amount, g.cur)}`); }
      S.entries = S.entries.filter(x => x.id !== form.id); closeSheet(); render(); toast('Silindi'); break;
    case 'paid': {
      const p = planAt(d.i);

    case 'copyamt': { const p = planAt(d.i); copyText((p.amt/100).toFixed(2).replace('.', ','), `Tutar kopyalandı: ${tlk(p.amt)}`); break; }
    case 'share': openSheet({mode:'share', text:shareText()}); break;
    case 'addperson': S.people.push(isFamilies() ? {id:uid(), name:'Yeni aile', size:2, kids:0} : {id:uid(), name:'Yeni kişi'}); render(); toast(isFamilies() ? 'Aile eklendi; adını ve kişi sayısını yaz.' : 'Kişi eklendi; adını yaz.'); break;
    case 'archive':
      if (!confirmArc){ confirmArc = true; render(); break; }
      confirmArc = false; S.trip.closed = true; S.trip.closedAt = Date.now(); logEvent('seyahati arşivledi');
      tab = 'list'; render(); window.scrollTo(0, 0); toast('🗄️ Seyahat arşivlendi; artık sadece görüntülenebilir.'); break;

      if (!isTripAdmin()){ toast('Bu ayarı değiştirme yetkin yok.'); break; }
      S.trip.closed = false; logEvent('seyahati arşivden çıkardı'); render(); toast('Seyahat yeniden düzenlenebilir.'); break;
    case 'deltrip':
      if (!confirmTrip){ confirmTrip = true; render(); break; }
      confirmTrip = false; deleteTrip(); break;
    case 'trips': openSheet({mode:'trips'}); break;
    case 'tripmore': tripMore = !tripMore; render(); break;
    case 'invite': inviteFriends(); break;
    case 'joinurl': joinFromLink(); break;
    case 'iosgo': iosGo = true; closeSheet(); setTimeout(maybeAskWho, 250); break;
    case 'newtrip': openSheet({mode:'newtrip', name:'', names:['','','',''], extra:[], kasaOn:false, kind:'friends'}); break;
    case 'sameteam':
      // 🔁 Aynı ekiple yeni seyahat: kişiler, emojiler, aile sayıları, telefon bağları, tür ve bütçe para birimi taşınır.
      openSheet({mode:'newtrip', name:'', names:S.people.map(p => p.name), extra:S.people.map(p => ({size:p.size, kids:p.kids, emoji:p.emoji, uid:p.uid})),
        kasaOn:!!S.trip.kasaOn, kind:KIND(), kidHalf:!!S.trip.kidHalf, planCur:S.trip.planCur}); break;
    case 'addp': (form.extra = form.extra || []).push({}); form.names.push(''); drawSheetKeep(); setTimeout(() => { const el = document.getElementById('nP' + (form.names.length-1)); if (el) el.focus(); }); break;
  }
});

// Form yeniden çizilirken kaydırma konumunu korur.
function drawSheetKeep(){
  const s = document.querySelector('.sheet'), top = s ? s.scrollTop : 0;
  drawSheet();
  const s2 = document.querySelector('.sheet'); if (s2) s2.scrollTop = top;
}

document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'planInp' && planDraft){ planDraft.v = el.value; return; }
  if (el.id === 'fDest' && form){ form.destDraft = el.value; return; }
  if (el.id === 'gwText' && form){ form.gwText = el.value; return; }
  if (el.classList && el.classList.contains('gatext') && form){ (form.gaT || (form.gaT = {}))[el.dataset.gac] = el.value; return; }
  if (el.dataset && el.dataset.gask && form){ const G = S.trip.greq || (S.trip.greq = {}); (G[el.dataset.gask] || (G[el.dataset.gask] = {})).ask = el.value.trim(); save(); return; }
  if (el.id === 'gNote' && form){ const P = S.trip.prefs || (S.trip.prefs = {}); (P[S.me] || (P[S.me] = {})).not = el.value.trim(); save(); return; }
  if (form && ['fWhen', 'fUntil', 'fFrom', 'fTo'].includes(el.id)){ form[{fWhen:'when', fUntil:'until', fFrom:'from', fTo:'to'}[el.id]] = el.value.trim(); if (el.id === 'fFrom' && !form.destEdit) drawPlace(); return; }
  if (el.id === 'shopQ'){ shopQ = el.value; const r = document.getElementById('shopRes'); if (r) r.innerHTML = shopRowsHtml(); return; }
  if (el.id === 'gWho' || el.id === 'gWhat' || el.id === 'gEst'){ giftDraft[{gWho:'who', gWhat:'what', gEst:'est'}[el.id]] = el.value; return; }
  if (form){
    if (el.id === 'fRate'){ const r = parseAmt(el.value); if (r > 0) form.rate = r; const c = document.getElementById('fConv'); if (c) c.textContent = convNote(); return; }
    if (el.id === 'fAmt'){ form.amount = el.value; form.autoAmt = false; const c = document.getElementById('fConv'); if (c) c.textContent = convNote(); const e = document.getElementById('fEach'); if (e) e.textContent = eachNote(); return; }
    if (el.id === 'fDesc'){
      form.desc = el.value;
      if (!form.catManual){
        form.cat = guessCat(el.value, S.learned); const c = catById(form.cat);
        document.getElementById('fCatNow').textContent = `${c.icon} ${c.name}`;
        document.getElementById('fAuto').textContent = el.value.trim() ? 'otomatik' : '';
        const cs = document.getElementById('fCats'); if (cs) cs.innerHTML = catChips();
      }
      // Gidilecek yer tahmini ve fotoğraf düğmesinin adı (Rezervasyon/Bilet/Fiş) yazdıkça güncellenir.
      if (!form.destEdit) drawPlace();
      { const b = document.getElementById('fBk'); if (b && (b.dataset.k || '') !== (bkKind(form) || '')){ b.innerHTML = bkHtml(); b.dataset.k = bkKind(form) || ''; } }
      { const pl = document.getElementById('fPhotoLbl'); if (pl && !form.photo) pl.textContent = docLabel(form); }
      return;
    }
    if (el.id === 'nName'){ form.name = el.value; return; }
    if (el.id === 'fNote'){ form.note = el.value; form.noteManual = true; return; }
    if (el.id === 'fStore'){
      form.store = el.value;
      // Bu mağazada daha önce şirket seçildiyse kendiliğinden gelir (kullanıcı seçmediyse).
      if (!form.opSet){ form.op = lastOp(el.value); const o = document.getElementById('fOp'); if (o) o.value = form.op; }
      return;
    }
    if (el.id === 'fTR'){ form.tr = el.value; return; }
    if (el.id === 'fSolo'){ form.desc = el.value; form.cat = guessCat(el.value, S.learned); const c = catById(form.cat), n = document.getElementById('fSoloCat'); if (n) n.textContent = `${c.icon} ${c.name}`;
      if (!form.destEdit) drawPlace();
      { const b = document.getElementById('fBk'); if (b && (b.dataset.k || '') !== (bkKind(form) || '')){ b.innerHTML = bkHtml(); b.dataset.k = bkKind(form) || ''; } }
      { const pl = document.getElementById('fPhotoLbl'); if (pl && !form.photo) pl.textContent = docLabel(form); }
      return; }
    if (el.dataset.li !== undefined){ form.lines[+el.dataset.li][el.dataset.lf] = el.value; return; }
    if (el.id === 'fDate'){
      form.date = el.value;
      // Gidişten önceki bir gün seçilirse (elle değiştirilmediyse) "Seyahat öncesi" olur.
      if (form.mode === 'expense' && !form.phaseManual && el.value){
        const st = S.trip.start, ph = st && el.value < st ? 'pre' : 'trip';
        if (ph !== form.phase){ form.phase = ph; if (ph === 'pre'){ setCur('TRY'); } drawSheetKeep(); }
      }
      return;
    }
    if (el.id === 'fOutlet'){ form.outlet = el.value; return; }
    if (el.id === 'nStart'){ form.start = el.value; return; }
    if (el.id === 'nEnd'){ form.end = el.value; return; }
    if (el.dataset.ni !== undefined){ form.names[+el.dataset.ni] = el.value; return; }
  }
});
document.addEventListener('change', async ev => {
  const el = ev.target, b = el.dataset.bind;
  if (form && el.dataset.g === 'gopus'){ form.gopus = el.checked; return; }
  if (form && el.id === 'nKasa'){ form.kasaOn = el.checked; return; }
  if (form && el.id === 'fTF'){ form.noTF = !el.checked; return; }
  if (form && el.id === 'fOp'){ form.op = el.value; form.opSet = true; return; }
  if (isRO() && !form && (el.dataset.pname || el.id === 'shOutlet' || (b && b !== 'me'))){ toast('🗄️ Seyahat arşivde.'); render(); return; }
  if (!form && !isManager() && (el.dataset.pname || MGR_BINDS.has(b))){ mgrOnly(); return; }
  if (!form && el.id === 'shOutlet'){ SH.outlet = el.value.trim(); saveShop(); render(); return; }
  if (form && el.id === 'fCur'){ if (el.value) setCur(el.value); drawSheetKeep(); return; }
  if (form && el.id === 'fSettle'){ form.settleTL = el.checked; if (el.checked && form.paidBy === 'kasa') form.paidBy = S.me; drawSheetKeep(); return; }
  if (form && el.id === 'icsIn' && el.files && el.files[0]){
    const f = form; try { const ev = icsParse(await el.files[0].text()); ev.forEach(x => { x.pick = icsGuess(x); }); if (form === f){ f.ics = ev; drawSheetKeep(); } }
    catch(_) { toast('Takvim dosyası okunamadı.'); }
    return;
  }
  if (form && el.classList.contains('gaphoto') && el.files && el.files[0]){
    try { const {mid} = await photoSizes(el.files[0]); guideAddWish('', mid, el.dataset.gac); } catch(_) { toast('Fotoğraf açılamadı.'); }
    return;
  }
  if (form && el.id === 'gwPhoto' && el.files && el.files[0]){
    try { const {mid} = await photoSizes(el.files[0]); guideAddWish('', mid); } catch(_) { toast('Fotoğraf açılamadı.'); }
    return;
  }
  if (form && el.dataset.gmove && el.value !== ''){
    const g = (S.trip.guide || {})[el.dataset.c], [i, k] = el.dataset.gmove.split('|').map(Number), j = +el.value; if (!g) return;
    const it = g.days[i].items.splice(k, 1)[0]; g.days[j].items.push(it); g.days[j].items.sort((a, b) => String(a.t).localeCompare(String(b.t)));
    save(); drawSheetKeep(); toast(`📅 ${it.name} → ${j + 1}. gün`); return;
  }
  if (form && el.dataset.gwcity){ const w = gWish().find(x => x.id === el.dataset.gwcity); if (w){ w.city = el.value; save(); drawSheetKeep(); } return; }
  if (form && el.dataset.icsi !== undefined && form.ics){ form.ics[+el.dataset.icsi].pick = el.value; return; }
  if (form && el.id === 'fPhoto' && el.files && el.files[0]){
    const f = form;
    try { const {lo, mid, hi} = await photoSizes(el.files[0]); if (form !== f) return; f.photo = lo; f.photoHi = hi; f.photoMid = mid; f.photoChanged = true; saveDraftPhoto(lo); drawSheetKeep(); }
    catch(_) { document.getElementById('fErr').textContent = 'Fotoğraf açılamadı. Başka bir fotoğraf dene.'; }
    return;
  }
  if (el.dataset.pname){ const p = person(el.dataset.pname); p.name = el.value.trim() || p.name; if (!p.emoji && memoEmoji(p)) p.emoji = memoEmoji(p); render(); return; }
  if (!b) return;
  if (b === 'name') S.trip.name = el.value.trim() || S.trip.name;
  if (b === 'country') S.trip.country = el.value || null;
  if (b === 'rate'){ const r = parseAmt(el.value); if (r > 0){ S.trip.rate = r; S.trip.rateSrc = 'manual'; S.trip.rateAt = Date.now(); } }
  if (b === 'bigEur' || b === 'bigTry'){
    const v = parsePlan(el.value), m = myBig(); m[b === 'bigEur' ? 'eur' : 'tr'] = v > 0 ? Math.round(v) : 0;
    try { localStorage.setItem(BIG_KEY(S.tid), JSON.stringify(m)); } catch(_) {}
    render(); return;
  }
  if (b === 'plan'){ const v = parsePlan(el.value); S.trip.plan = v > 0 ? Math.round(v) : 0; }
  if (b === 'planCur') S.trip.planCur = el.value;
  if (b === 'start' || b === 'end') S.trip[b] = el.value || null;
  if (b === 'me' && myUid && myPerson()){ render(); return; }
  if (b === 'me'){ S.me = el.value; try { localStorage.setItem(meKey(S.tid), S.me); } catch(_) {} }
  if (b === 'kasaOn') S.trip.kasaOn = el.checked;
  if (b === 'kind'){ S.trip.kind = el.value; logEvent(`seyahat türünü değiştirdi: ${el.options[el.selectedIndex].text}`); }
  if (b === 'kidHalf') S.trip.kidHalf = el.checked;
  if (b === 'holder') S.trip.holder = el.value;
  render(); if (b === 'rate') toast('Kur elle güncellendi');
});
// Bütçe büyük ve kuruşsuz bir TL tutarıdır: "60.000" altmış bin demektir (nokta binlik ayırıcı).
const parsePlan = s => parseAmt(String(s).replace(/\./g, ''));
// Karttaki bütçe kutusu: Kaydet ya da Enter ile kaydedilir.
function savePlan(){
  const i = document.getElementById('planInp'); if (!i) return;
  const v = parsePlan(i.value); S.trip.plan = v > 0 ? Math.round(v) : 0;
  S.trip.planCur = (planDraft && planDraft.cur) || planCurOf(); editPlan = false; planDraft = null; render();
  logEvent(S.trip.plan ? `bütçeyi değiştirdi: kişi başı ${nf0.format(S.trip.plan)} ${symOf(S.trip.planCur)}` : 'bütçe takibini kapattı');
  toast(S.trip.plan ? `Bütçe: kişi başı ${nf0.format(S.trip.plan)} ${symOf(S.trip.planCur)}` : 'Bütçe takibi kapatıldı');
}
document.addEventListener('keydown', ev => {
  if (['gWho', 'gWhat', 'gEst'].includes(ev.target.id) && ev.key === 'Enter'){ ev.preventDefault(); document.querySelector('[data-act=addgift]').click(); return; }
  if (ev.target.id === 'shLimit' && ev.key === 'Enter'){ ev.preventDefault(); document.querySelector('[data-act=saveshoplimit]').click(); return; }
  if (ev.target.id === 'planInp' && ev.key === 'Enter'){ ev.preventDefault(); savePlan(); return; }
  if (ev.target.id === 'planInp' && ev.key === 'Escape'){ editPlan = false; planDraft = null; render(); return; }
  if (!form) return;
  if (ev.target.id === 'fDest' && ev.key === 'Enter'){ ev.preventDefault(); document.querySelector('[data-act=destok]').click(); return; }
  if (ev.key === 'Escape') closeSheet();
  if (ev.key === 'Enter' && ev.target.tagName === 'INPUT' && ev.target.type !== 'file') { ev.preventDefault(); submit(); }
});

// 🔎 Ara: bağlantıya dokunulduğu anda formdaki mağaza ve ürün adıyla Türkiye araması kurulur.
document.addEventListener('click', ev => {
  const a = ev.target.closest('a[data-trq]'); if (!a || !form) return;
  const i = a.dataset.trq, l = i === 'all' ? null : (form.lines || [])[+i];
  a.href = trQuery(form.store, l ? l.name : '');
}, true);

// Yazılan her harf taslağa kaydedilir (ana olay dinleyicilerinden sonra çalışır).
document.addEventListener('input', () => { if (form) saveDraft(); });

loadLogs(); loadShop();
render();
renderCloud();
restoreDraft();
maybeAskWho();
startSample();
// Kur 30 dakikadan eskiyse açılışta internetten tazele.
if (Date.now() - S.trip.rateAt > 30*6e4) fetchRate(false);
startCloud();
</script>

  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !done){ done = true; location.reload(); } });
  try { const reg = await navigator.serviceWorker.register('sw.js'); document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); }); } catch(_) {}
